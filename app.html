      dreamCareer: '',
      updatedAt: null,
    };
  }

  function getPathwayProfile(data, studentId, name) {
    const all = data.pathwayProfiles && typeof data.pathwayProfiles === 'object' ? data.pathwayProfiles : {};
    return all[studentId] ? { ...emptyPathwayProfile(studentId, name), ...all[studentId] } : emptyPathwayProfile(studentId, name);
  }

  function savePathwayProfile(studentId, profile) {
    Store.update((d) => {
      if (!d.pathwayProfiles || typeof d.pathwayProfiles !== 'object') d.pathwayProfiles = {};
      d.pathwayProfiles[studentId] = {
        ...profile,
        studentId,
        updatedAt: new Date().toISOString(),
      };
    });
  }

  function parseGrade(v) {
    const n = Number(v);
    if (!Number.isFinite(n)) return null;
    if (n <= 4) return Math.max(0, Math.min(4, n)) * 25; // GPA-ish → 0-100
    return Math.max(0, Math.min(100, n));
  }

  function blankDomainScores() {
    const o = {};
    PATHWAY_DOMAINS.forEach((d) => { o[d.id] = 0; });
    return o;
  }

  function addWeights(target, map, factor) {
    if (!map) return;
    Object.entries(map).forEach(([k, w]) => {
      if (target[k] == null) target[k] = 0;
      target[k] += w * factor;
    });
  }

  function collectStudentActivitySignals(data, sessionName, studentId) {
    const scores = blankDomainScores();
    let count = 0;
    (data.activities || []).forEach((raw) => {
      const a = typeof normalizeActivity === 'function' ? normalizeActivity(raw) : raw;
      const inTeam = findMyTeam(a, sessionName, studentId);
      const inBuddy = findBuddy(a, sessionName, studentId);
      if (!inTeam && !inBuddy) return;
      count += 1;
      addWeights(scores, ACT_DOMAIN_MAP[a.category] || ACT_DOMAIN_MAP['อื่น ๆ'], 18);
      addWeights(scores, { lead: 0.35 }, 12);
    });
    return { scores, count };
  }

  function collectVideoSignals(data) {
    const scores = blankDomainScores();
    let count = 0;
    (data.videos || []).forEach((v) => {
      const views = Number(v.views || 0);
      if (views <= 0) return;
      count += 1;
      addWeights(scores, VIDEO_SUBJECT_DOMAIN[v.subject], Math.min(20, 6 + views * 2));
    });
    return { scores, count };
  }

  function analyzePathway(profile, data, sessionName, studentId) {
    const scores = blankDomainScores();
    const sources = [];

    // grades
    let gradeN = 0;
    Object.entries(profile.grades || {}).forEach(([k, v]) => {
      const g = parseGrade(v);
      if (g == null) return;
      gradeN += 1;
      addWeights(scores, GRADE_DOMAIN_MAP[k], g * 0.45);
    });
    if (gradeN) sources.push('เกรด ' + gradeN + ' วิชา');

    // interests
    (profile.interests || []).forEach((i) => addWeights(scores, INTEREST_DOMAIN_MAP[i], 22));
    if ((profile.interests || []).length) sources.push('ความสนใจ ' + profile.interests.length + ' ด้าน');

    // aptitudes
    (profile.aptitudes || []).forEach((i) => addWeights(scores, APTITUDE_DOMAIN_MAP[i], 20));
    if ((profile.aptitudes || []).length) sources.push('ความถนัด ' + profile.aptitudes.length + ' ด้าน');

    // goals / dream keyword boost
    const goalText = `${profile.goals || ''} ${profile.dreamCareer || ''}`.toLowerCase();
    const keywordBoosts = [
      [/หมอ|พยาบาล|สาธารณสุข|แพทย์|สุขภาพ/, { health: 28, science: 12 }],
      [/วิศวะ|วิศว|โปรแกรม|โค้ด|คอม|ไอที|ซอฟต์/, { tech: 28, math: 12 }],
      [/ธุรกิจ|การตลาด|บัญชี|การเงิน|ผู้ประกอบ/, { business: 28, lead: 8 }],
      [/ครู|สอน|การศึกษา/, { social: 18, language: 12, lead: 12 }],
      [/กฎหมาย|นิติ|รัฐศาสตร์|การเมือง/, { social: 28, language: 10 }],
      [/ออกแบบ|ศิลปะ|สถาปัตย์|กราฟิก|ดนตรี/, { creative: 28 }],
      [/ภาษา|แปล|สื่อ|นิเทศ|คอนเทนต์/, { language: 24, creative: 10 }],
      [/เกษตร|อาหาร|สิ่งแวดล้อม/, { science: 16, health: 8, business: 8 }],
    ];
    keywordBoosts.forEach(([re, map]) => {
      if (re.test(goalText)) addWeights(scores, map, 1);
    });
    if ((profile.goals || '').trim() || (profile.dreamCareer || '').trim()) sources.push('เป้าหมาย');

    const act = collectStudentActivitySignals(data, sessionName, studentId);
    Object.keys(scores).forEach((k) => { scores[k] += act.scores[k] || 0; });
    if (act.count) sources.push('กิจกรรม ' + act.count + ' รายการ');

    // light global video popularity signal — optional weak prior from school catalog engagement
    const vid = collectVideoSignals(data);
    Object.keys(scores).forEach((k) => { scores[k] += (vid.scores[k] || 0) * 0.15; });

    // normalize 0-100
    const maxRaw = Math.max(1, ...Object.values(scores));
    const normalized = {};
    PATHWAY_DOMAINS.forEach((d) => {
      normalized[d.id] = Math.round(Math.min(100, (scores[d.id] / maxRaw) * 100));
    });

    const rankedDomains = PATHWAY_DOMAINS
      .map((d) => ({ ...d, score: normalized[d.id] }))
      .sort((a, b) => b.score - a.score);

    const matches = PATHWAY_CATALOG.map((p) => {
      let num = 0;
      let den = 0;
      Object.entries(p.weights).forEach(([k, w]) => {
        num += (normalized[k] || 0) * w;
        den += w * 100;
      });
      const fit = Math.round((num / Math.max(den, 1)) * 100);
      return { ...p, fit };
    }).sort((a, b) => b.fit - a.fit);

    const top = matches[0];
    const tracks = [...new Set(matches.slice(0, 4).map((m) => m.track))];

    const completeness = Math.min(
      100,
      (gradeN >= 3 ? 25 : gradeN * 8) +
        Math.min(30, (profile.interests || []).length * 6) +
        Math.min(25, (profile.aptitudes || []).length * 5) +
        ((profile.goals || '').trim() ? 10 : 0) +
        ((profile.dreamCareer || '').trim() ? 10 : 0)
    );

    return {
      scores: normalized,
      rankedDomains,
      matches,
      top,
      tracks,
      sources,
      completeness,
      activityCount: act.count,
    };
  }

                      <div class="strength-bar"><i data-w="${d.score}"></i></div>
                      <div class="pct">${d.score}</div>
                    </div>`).join('')}
                </div>
                <h3 class="mt-3">สายการเรียนที่สอดคล้อง</h3>
                <div class="track-pills">
                  ${analysis.tracks.map((t, i) => `<span class="track-pill ${i === 0 ? 'top' : ''}">${i === 0 ? '★ ' : ''}${esc(t)}</span>`).join('')}
                </div>
              </div>
            </div>

            <h3 style="margin:.2rem 0 .85rem;color:var(--plum-900)">คณะ · สาขา · สถาบัน ที่แนะนำ</h3>
            <div class="match-grid">
              ${top3.map((m, idx) => `
                <article class="match-item rank-${idx + 1}">
                  <div class="match-rank">#${idx + 1}</div>
                  <div class="fit">เหมาะกับคุณ ${m.fit}%</div>
                  <h4>${esc(m.title)}</h4>
                  <p class="muted" style="font-size:.9rem">${esc(m.why)}</p>
                  <div class="match-tags">
                    <span>${esc(m.track)}</span>
                    ${(m.faculties || []).map((f) => `<span>${esc(f)}</span>`).join('')}
                  </div>
                  <strong style="font-size:.86rem;color:var(--plum-800)">สาขาแนะนำ</strong>
                  <ul>${(m.majors || []).slice(0, 4).map((x) => `<li>${esc(x)}</li>`).join('')}</ul>
                  <strong style="font-size:.86rem;color:var(--plum-800)">สถาบันตัวอย่าง</strong>
                  <ul>${(m.unis || []).slice(0, 4).map((x) => `<li>${esc(x)}</li>`).join('')}</ul>
                  <strong style="font-size:.86rem;color:var(--plum-800)">อาชีพที่ไปต่อได้</strong>
                  <ul>${(m.careers || []).slice(0, 4).map((x) => `<li>${esc(x)}</li>`).join('')}</ul>
                </article>`).join('')}
            </div>

            <div class="pathway-layout">
              <div class="pathway-panel">
                <h3>เส้นทางการเรียนในอนาคต</h3>
                <p class="sub">แผนทีละขั้นตามสาย ${esc(top.title)}</p>
                <div class="pathway-timeline">
                  ${(top.roadmap || []).map((s) => `
                    <div class="pathway-step">
                      <div class="when">${esc(s.when)}</div>
                      <h5>${esc(s.title)}</h5>
                      <p>${esc(s.body)}</p>
                    </div>`).join('')}
                </div>
              </div>
              <div class="pathway-panel">
                <h3>สิ่งที่ควรทำต่อทันที</h3>
                <p class="sub">เลือกทำ 2–3 ข้อนี้ในเดือนนี้</p>
                <div class="pathway-timeline">
                  <div class="pathway-step"><div class="when">วิชาเสริม</div><h5>เรียนวิดีโอตามจุดแข็ง/จุดอ่อน</h5><p>เน้นวิชาที่คะแนนสูงเพื่อต่อยอด และวิชาที่คะแนนต่ำเพื่อเก็บพื้นฐานก่อนสอบเข้า</p></div>
                  <div class="pathway-step"><div class="when">กิจกรรม</div><h5>เลือกกิจกรรมที่เสริมสาย ${esc(top.track)}</h5><p>${analysis.activityCount ? 'คุณมีกิจกรรมในระบบแล้ว — ลองกิจกรรมประเภทอื่นเพิ่มด้วย' : 'ยังไม่มีกิจกรรมในระบบ — สมัครแข่งหรืออบรมเพื่อให้วิเคราะห์แม่นขึ้น'}</p></div>
                  <div class="pathway-step"><div class="when">เป้าหมาย</div><h5>${esc(profile.dreamCareer || 'ตั้งอาชีพในฝันให้ชัดขึ้น')}</h5><p>${esc(profile.goals || 'อัปเดตเป้าหมายให้ชัดขึ้น เช่น คณะ สถาบัน หรือทักษะที่อยากมีใน 1 ปี')}</p></div>
                  <div class="pathway-step"><div class="when">แฟ้มผลงาน</div><h5>เก็บหลักฐานความสามารถ</h5><p>รางวัล โครงงาน ชมรม หรือผลงานออนไลน์ จะช่วยตัดสินใจและยื่นเข้าเรียนได้ดีขึ้น</p></div>
                </div>
              </div>
            </div>
            <p class="muted" style="font-size:.84rem;margin-top:.5rem">หมายเหตุ: ผลนี้เป็นแนวทางช่วยตัดสินใจจากข้อมูลที่คุณให้ ไม่ใช่คำตอบตายตัว — ควรคุยกับครูแนะแนวด้วย</p>`;

          document.getElementById('pathwayEditBtn').onclick = () => {
            pathwayMode = 'edit';
            render();
          };
          shell.content.querySelectorAll('[data-go]').forEach((el) => {
            el.onclick = (e) => {
              e.preventDefault();
              section = el.dataset.go;
              render();
            };
          });

          requestAnimationFrame(() => {
            shell.content.querySelectorAll('.strength-bar > i').forEach((el) => {
              el.style.width = `${el.dataset.w || 0}%`;
            });
            const canvas = document.getElementById('pathwayRadar');
            if (canvas && window.Chart) {
              if (pathwayChart) {
                pathwayChart.destroy();
                pathwayChart = null;
              }
              pathwayChart = new Chart(canvas, {
                type: 'radar',
                data: {
                  labels: PATHWAY_DOMAINS.map((d) => d.label),
                  datasets: [{
                    label: 'ข้อมูลของคุณ',
                    data: PATHWAY_DOMAINS.map((d) => analysis.scores[d.id] || 0),
                    borderColor: '#c9a24a',
                    backgroundColor: 'rgba(47, 184, 137, 0.22)',
                    pointBackgroundColor: '#2fb889',
                    pointBorderColor: '#fff',
                    borderWidth: 2,
                  }],
                },
                options: {
                  responsive: true,
                  maintainAspectRatio: false,
                  plugins: { legend: { display: false } },
                  scales: {
                    r: {
                      min: 0,
                      max: 100,
                      ticks: { display: false, stepSize: 20 },
                      grid: { color: 'rgba(94,45,150,.12)' },
                      angleLines: { color: 'rgba(94,45,150,.12)' },
                      pointLabels: {
                        font: { family: 'Prompt', size: 11, weight: '600' },
                        color: '#3a1d5c',
                      },
                    },
                  },
                },
              });
            }
          });
        };

        if (pathwayMode === 'edit') renderPathwayForm();
        else renderPathwayResult();
      }

      if (section === 'videos') {
        const list = data.videos.filter((v) => v.subject === videoFilter);
        shell.content.innerHTML = `
          <div class="section-intro"><p>เลือกหมวดวิชาเพื่อดูวิดีโอสรุปบทเรียน</p></div>
          <div class="subject-pills">${SUBJECTS
            .map((s) => `<button type="button" class="subject-pill ${videoFilter === s ? 'active' : ''}" data-sub="${s}">${s}</button>`)
            .join('')}</div>
          <div class="video-grid">${list
            .map(
              (v) => `<article class="video-card" data-play="${v.id}">
              <div class="video-thumb"><div class="play">▶</div></div>
              <div class="video-body"><span class="badge badge-purple">${esc(v.subject)}</span>
              ${v.gradeTerm || v.desc ? `<div class="meta" style="margin-top:.25rem">${esc(v.gradeTerm || v.desc)}</div>` : ''}
              <h4 class="mt-1">${esc(v.title)}</h4>
              <div class="meta">${esc(v.teacher)} · ${esc(v.duration)} · ${v.views || 0} ครั้ง</div></div></article>`
            )
            .join('') || '<div class="empty-state">ยังไม่มีวิดีโอในหมวดนี้</div>'}</div>`;
        shell.content.querySelectorAll('[data-sub]').forEach((btn) => {
          btn.onclick = () => {
            videoFilter = btn.dataset.sub;
            render();
          };
        });
        shell.content.querySelectorAll('[data-play]').forEach((card) => {
          card.onclick = () => {
            const v = Store.load().videos.find((x) => x.id === card.dataset.play);
            if (v) playVideo(v);
          };
        });
      }

      if (section === 'activities') {
        shell.content.innerHTML = `
          <div class="section-intro"><p>สภาประกาศกิจกรรมให้ — <strong>คุณสร้างทีมเอง</strong> สำหรับการแข่งขัน หรือ <strong>หาเพื่อนไปด้วย</strong> สำหรับอบรม/ค่าย</p></div>
          <div class="filter-bar"><select class="form-control" id="actFilter"><option value="">ทุกประเภท</option>
            <option>แข่งขันวิชาการ</option><option>แข่งโครงงาน</option><option>แข่งนวัตกรรม</option><option>อบรม/ค่าย</option><option>อื่น ๆ</option></select></div>
          <div class="grid-2" id="actBoard"></div>
          <div class="panel mt-3"><div class="panel-header"><h3>ของฉัน</h3></div><div id="myTeams"></div></div>`;

        const draw = async () => {
          const filter = document.getElementById('actFilter').value;
          const list = Store.load().activities.map(normalizeActivity).filter((a) => !filter || a.category === filter);
          document.getElementById('actBoard').innerHTML = list
            .map((a) => {
              const myTeam = findMyTeam(a, session.name, studentId);
              const myBuddy = findBuddy(a, session.name, studentId);
              if (a.mode === 'buddy') {
                const buddies = a.buddies || [];
                return `<div class="activity-card">
                  ${mediaSlot(a.imageId, 'activity-cover')}
                  <div class="flex justify-between flex-wrap gap-2">
                    <span class="badge badge-gold">${esc(a.category)}</span>
                    <span class="badge badge-info">หาเพื่อนไปด้วย</span>
                    ${myBuddy ? '<span class="badge badge-success">คุณลงชื่อแล้ว</span>' : a.open ? '<span class="badge badge-success">เปิดอยู่</span>' : '<span class="badge badge-danger">ปิดแล้ว</span>'}
                  </div>
                  <h4>${esc(a.title)}</h4>
                  <p class="muted">${esc(a.desc || '')}</p>
                  <p class="muted">${formatDate(a.date)} · ${esc(a.place)}</p>
                  <div class="sub-card">
                    <h5>เพื่อนที่อยากไปด้วย (${buddies.length})</h5>
                    <div class="team-slot">${buddies.map((b) => `<span class="buddy-chip">👋 ${esc(memberLabel(b))}</span>`).join('') || '<span class="muted">ยังไม่มีใคร — เป็นคนแรกได้เลย</span>'}</div>
                  </div>
                  <div class="toolbar-row">
                    ${
                      !myBuddy && a.open
                        ? `<button class="btn btn-primary btn-sm" data-buddy-join="${a.id}">อยากไป — หาเพื่อน</button>`
                        : ''
                    }
                    ${myBuddy ? `<button class="btn btn-outline btn-sm" data-buddy-leave="${a.id}">ยกเลิกการลงชื่อ</button>` : ''}
                  </div>
                </div>`;
              }

              const teams = a.teams || [];
              return `<div class="activity-card">
                ${mediaSlot(a.imageId, 'activity-cover')}
                <div class="flex justify-between flex-wrap gap-2">
                  <span class="badge badge-gold">${esc(a.category)}</span>
                  <span class="badge badge-info">สร้างทีมเอง</span>
                  ${myTeam ? '<span class="badge badge-success">คุณอยู่ในทีม</span>' : a.open ? '<span class="badge badge-success">เปิดอยู่</span>' : '<span class="badge badge-danger">ปิดแล้ว</span>'}
                </div>
                <h4>${esc(a.title)}</h4>
                <p class="muted">${esc(a.desc || '')}</p>
                <p class="muted">${formatDate(a.date)} · ${esc(a.place)} · แนะนำทีมละ ${a.suggestedSize || 3} คน</p>
                <div class="sub-card">
                  <h5>ทีมจากนักเรียน (${teams.length})</h5>
                  ${
                    teams.length
                      ? teams
                          .map((t) => {
                            const slots = Math.max(0, (t.maxSize || 3) - (t.members || []).length);
                            const inTeam =
                              (t.members || []).some(
                                (m) => memberMatches(m, session.name) || (typeof m === 'object' && m.studentId === studentId)
                              ) || t.leader === session.name || t.leaderId === studentId;
                            return `<div style="margin:.55rem 0;padding:.55rem 0;border-top:1px solid rgba(94,45,150,.08)">
                              <strong>🏁 ${esc(t.name)}</strong>
                              <span class="muted"> · หัวหน้า ${esc(t.leader)}</span>
                              ${teamFillBar(t.members, t.maxSize)}
                              <div class="team-slot">${(t.members || []).map((m) => `<span class="member-chip">👤 ${esc(memberLabel(m))}</span>`).join('')}
                              ${slots && t.open ? `<span class="muted">ว่าง ${slots}</span>` : ''}</div>
                              ${
                                !myTeam && a.open && t.open && slots
                                  ? `<button class="btn btn-primary btn-sm" data-join-team="${a.id}" data-team="${t.id}">ขอเข้าทีมนี้</button>`
                                  : ''
                              }
                              ${
                                inTeam && t.leader === session.name
                                  ? `<button class="danger-link" data-disband="${a.id}" data-team="${t.id}">ยุบทีม</button>`
                                  : ''
                              }
                              ${
                                inTeam && t.leader !== session.name
                                  ? `<button class="btn btn-outline btn-sm" data-leave-team="${a.id}" data-team="${t.id}">ออกจากทีม</button>`
                                  : ''
                              }
                            </div>`;
                          })
                          .join('')
                      : '<p class="muted">ยังไม่มีทีม — สร้างทีมแรกได้เลย</p>'
                  }
                </div>
                <div class="toolbar-row">
                  ${
                    !myTeam && a.open
                      ? `<button class="btn btn-primary btn-sm" data-create-team="${a.id}">สร้างทีมของฉัน</button>`
                      : ''
                  }
                </div>
              </div>`;
            })
            .join('') || '<div class="empty-state">ไม่พบกิจกรรม</div>';

          await hydrateImages(document.getElementById('actBoard'));

          document.querySelectorAll('[data-create-team]').forEach((btn) => {
            btn.onclick = async () => {
              const actId = btn.dataset.createTeam;
              const act = normalizeActivity(Store.load().activities.find((x) => x.id === actId));
              if (!act || !act.open) return;
              if (isInActivityTeam(act, session.name, studentId)) {
                toast('คุณอยู่ในทีมของกิจกรรมนี้อยู่แล้ว', 'warning');
                return;
              }
              const info = await openSignupForm({
                title: 'สร้างทีม — ' + act.title,
                showTeamName: true,
                defaults: {
                  teamName: 'ทีมของ ' + session.name,
                  name: session.name,
                  className: '',
                  contact: '',
                },
              });
              if (!info) return;
              Store.update((d) => {
                ensureActivitiesShape(d);
                const a = d.activities.find((x) => x.id === actId);
                if (!a || !a.open) return;
                if (isInActivityTeam(a, info.name, studentId) || isInActivityTeam(a, session.name, studentId)) return;
                a.teams = a.teams || [];
                a.teams.unshift({
                  id: uid('tm'),
                  name: info.teamName || 'ทีมของ ' + info.name,
                  leader: info.name,
                  leaderId: studentId,
                  members: [
                    {
                      name: info.name,
                      className: info.className,
                      contact: info.contact,
                      studentId,
                    },
                  ],
                  maxSize: a.suggestedSize || 3,
                  open: true,
                  createdAt: todayISO(),
                });
              });
              toast('สร้างทีมแล้ว — ชวนเพื่อนมาร่วมได้', 'success');
              draw();
              myTeams();
            };
          });

          document.querySelectorAll('[data-join-team]').forEach((btn) => {
            btn.onclick = async () => {
              const actId = btn.dataset.joinTeam;
              const teamId = btn.dataset.team;
              const act = normalizeActivity(Store.load().activities.find((x) => x.id === actId));
              if (!act || !act.open) return;
              if (isInActivityTeam(act, session.name, studentId)) {
                toast('คุณอยู่ในทีมของกิจกรรมนี้อยู่แล้ว', 'warning');
                return;
              }
              const info = await openSignupForm({
                title: 'สมัครเข้าทีม',
                defaults: { name: session.name, className: '', contact: '' },
              });
              if (!info) return;
              Store.update((d) => {
                ensureActivitiesShape(d);
                const a = d.activities.find((x) => x.id === actId);
                if (!a || !a.open) return;
                if (isInActivityTeam(a, info.name, studentId) || isInActivityTeam(a, session.name, studentId)) return;
                const t = (a.teams || []).find((x) => x.id === teamId);
                if (!t || !t.open || (t.members || []).length >= (t.maxSize || 3)) return;
                t.members.push({
                  name: info.name,
                  className: info.className,
                  contact: info.contact,
                  studentId,
                });
                if (t.members.length >= t.maxSize) t.open = false;
              });
              toast('เข้าร่วมทีมแล้ว', 'success');
              draw();
              myTeams();
            };
          });

          document.querySelectorAll('[data-leave-team]').forEach((btn) => {
            btn.onclick = () => {
              const actId = btn.dataset.leaveTeam;
              const teamId = btn.dataset.team;
              Store.update((d) => {
                ensureActivitiesShape(d);
                const a = d.activities.find((x) => x.id === actId);
                const t = (a?.teams || []).find((x) => x.id === teamId);
                if (!t || t.leader === session.name || t.leaderId === studentId) return;
                t.members = (t.members || []).filter(
                  (m) => !memberMatches(m, session.name) && !(typeof m === 'object' && m.studentId === studentId)
                );
                t.open = true;
              });
              toast('ออกจากทีมแล้ว');
              draw();
              myTeams();
            };
          });

          document.querySelectorAll('[data-disband]').forEach((btn) => {
            btn.onclick = () => {
              if (!confirm('ยุบทีมนี้? สมาชิกทั้งหมดจะออกจากทีม')) return;
              const actId = btn.dataset.disband;
              const teamId = btn.dataset.team;
              Store.update((d) => {
                ensureActivitiesShape(d);
                const a = d.activities.find((x) => x.id === actId);
                if (!a) return;
                a.teams = (a.teams || []).filter(
                  (t) => !(t.id === teamId && (t.leader === session.name || t.leaderId === studentId))
                );
              });
              toast('ยุบทีมแล้ว');
              draw();
              myTeams();
            };
          });

          document.querySelectorAll('[data-buddy-join]').forEach((btn) => {
            btn.onclick = async () => {
              const actId = btn.dataset.buddyJoin;
              const act = normalizeActivity(Store.load().activities.find((x) => x.id === actId));
              if (!act || !act.open) return;
              const info = await openSignupForm({
                title: 'ลงชื่อหาเพื่อนไปด้วย — ' + act.title,
                defaults: { name: session.name, className: '', contact: '' },
              });
              if (!info) return;
              Store.update((d) => {
                ensureActivitiesShape(d);
                const a = d.activities.find((x) => x.id === actId);
                if (!a || !a.open || a.mode !== 'buddy') return;
                if (findBuddy(a, info.name, studentId) || findBuddy(a, session.name, studentId)) return;
                a.buddies = a.buddies || [];
                a.buddies.unshift({
                  id: uid('bd'),
                  name: info.name,
                  className: info.className,
                  contact: info.contact,
                  studentId,
                  note: info.className,
                  createdAt: todayISO(),
                });
              });
              toast('ลงชื่อหาเพื่อนแล้ว — เพื่อนจะเห็นชื่อ ชั้น และช่องทางติดต่อ', 'success');
              draw();
              myTeams();
            };
          });

          document.querySelectorAll('[data-buddy-leave]').forEach((btn) => {
            btn.onclick = () => {
              const actId = btn.dataset.buddyLeave;
              Store.update((d) => {
                ensureActivitiesShape(d);
                const a = d.activities.find((x) => x.id === actId);
                if (!a) return;
                a.buddies = (a.buddies || []).filter((b) => b.name !== session.name && b.studentId !== studentId);
              });
              toast('ยกเลิกการลงชื่อแล้ว');
              draw();
              myTeams();
            };
          });
        };

        const myTeams = () => {
          const acts = Store.load().activities.map(normalizeActivity);
          const mineTeams = [];
          const mineBuddies = [];
          acts.forEach((a) => {
            const t = findMyTeam(a, session.name, studentId);
            if (t) mineTeams.push({ a, t });
            const b = findBuddy(a, session.name, studentId);
            if (b) mineBuddies.push({ a, b });
          });
          let html = '';
          if (mineTeams.length) {
            html += mineTeams
              .map(
                ({ a, t }) =>
                  `<div class="feed-item"><div class="feed-dot">🏁</div><div class="feed-body"><h4>${esc(t.name)} · ${esc(a.title)}</h4>
                  <p class="time">แข่งขัน · ${formatDate(a.date)} · สมาชิก ${(t.members || []).length}/${t.maxSize}</p>
                  ${teamFillBar(t.members, t.maxSize)}
                  <p class="muted">สมาชิก: ${(t.members || []).map((m) => esc(memberLabel(m))).join(', ')}</p></div></div>`
              )
              .join('');
          }
          if (mineBuddies.length) {
            html += mineBuddies
              .map(
                ({ a, b }) =>
                  `<div class="feed-item"><div class="feed-dot">👋</div><div class="feed-body"><h4>หาเพื่อนไป · ${esc(a.title)}</h4>

  function initLogin() {
    let selectedRole = null;
    const cards = document.querySelectorAll('.role-card');
    const box = document.getElementById('loginBox');
    const label = document.getElementById('loginRoleLabel');
    const roleIcon = document.getElementById('loginRoleIcon');
    const studentExtra = document.getElementById('studentExtra');
    const demoHint = document.getElementById('loginDemoHint');
    const loginRoot = document.getElementById('login-root');
    const iconByRole = {
      admin: '🏛️',
      teacher: '👩‍🏫',
      council: '🎖️',
      student: '🎒',
    };
    const demoByRole = {
      admin: 'บัญชีทดสอบ: 0937107114 / 0937107114',
      teacher: 'บัญชีทดสอบ: 0937107114 / 0937107114',
      council: 'บัญชีทดสอบ: 0937107114 / 0937107114',
      student: 'บัญชีทดสอบ: 0937107114 / 0937107114',
    };

    function selectRole(role) {
      selectedRole = role;
      cards.forEach((c) => c.classList.toggle('selected', c.dataset.role === role));
      label.textContent = 'เข้าสู่ระบบในฐานะ ' + ROLES[role].label;
      if (roleIcon) roleIcon.textContent = iconByRole[role] || '🔐';
      studentExtra.style.display = role === 'student' ? 'block' : 'none';
      if (demoHint) demoHint.textContent = demoByRole[role] || '';
      loginRoot.classList.add('auth-step');
      box.classList.add('show');
      document.getElementById('loginUsername').focus();
      requestAnimationFrame(() => {
        box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      });
    }

    function backToRoles() {
      selectedRole = null;
      cards.forEach((c) => c.classList.remove('selected'));
      loginRoot.classList.remove('auth-step');
      box.classList.remove('show');
      document.getElementById('loginForm').reset();
      studentExtra.style.display = 'none';
      if (demoHint) demoHint.textContent = '';
    }

    document.getElementById('loginBack').addEventListener('click', backToRoles);

    cards.forEach((card) => {
      card.addEventListener('click', () => selectRole(card.dataset.role));
      card.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          selectRole(card.dataset.role);
        }
      });
    });

    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      if (!selectedRole) {
        toast('กรุณาเลือกบทบาทก่อน', 'error');
        return;
      }
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;
      const studentIdInput = document.getElementById('studentId').value.trim();

      const account = ACCOUNTS.find(
        (a) => a.username === username && a.password === password
      );
      if (!account) {
        toast('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง', 'error');
        return;
      }
      if (!account.allRoles && account.role !== selectedRole) {
        toast('บัญชีนี้ไม่ตรงกับบทบาทที่เลือก', 'error');
        return;
      }

      const studentId =
        selectedRole === 'student' ? studentIdInput || account.studentId || '17001' : null;
      const roleLabel = ROLES[selectedRole]?.label || selectedRole;
      const displayName = account.allRoles
        ? account.name + ' (' + roleLabel + ')'
        : account.name || username;

      Auth.set({
        role: selectedRole,
        name: displayName,
        username: account.username,
        studentId,
        isSuperAdmin: !!account.allRoles,
        loginAt: new Date().toISOString(),
      });
      if (selectedRole === 'student') {
        Store.update((d) => ensureBehavior(d, studentId, displayName));
      }
      toast('ยินดีต้อนรับ ' + displayName, 'success');
      setTimeout(() => enterRole(selectedRole), 200);
    });
  }

  if (session && ROLES[session.role]) enterRole(session.role);

  window.BanphaiApp = { Store, Auth, enterRole, showLogin };
})();

</script>
