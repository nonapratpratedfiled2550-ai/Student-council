<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>สภานักเรียนโรงเรียนบ้านไผ่</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&family=Sarabun:wght@300;400;500;600;700&display=swap');

:root {
  --plum-950: #14081f;
  --plum-900: #241238;
  --plum-850: #2f1749;
  --plum-800: #3a1d5c;
  --plum-700: #4b2478;
  --plum-600: #5e2d96;
  --plum-500: #7a3fb8;
  --plum-400: #9a63d1;
  --plum-300: #b98de0;
  --plum-200: #d7b8ef;
  --plum-100: #eee0f8;
  --plum-50: #f8f2fc;
  --ink: #1a1028;
  --muted: #6f5f82;
  --line: rgba(94, 45, 150, 0.14);
  --white: #ffffff;
  --paper: #fcfaff;
  --gold: #c9a24a;
  --gold-soft: #f0df9a;
  --success: #0f8a62;
  --warning: #c97812;
  --danger: #c23b3b;
  --info: #2f6fed;
  --shadow: 0 10px 40px rgba(36, 18, 56, 0.1);
  --shadow-lg: 0 24px 60px rgba(36, 18, 56, 0.16);
  --shadow-glow: 0 12px 40px rgba(94, 45, 150, 0.28);
  --radius: 22px;
  --radius-sm: 14px;
  --nav-h: 72px;
  --sidebar-w: 280px;
  --font-display: 'Prompt', sans-serif;
  --font-body: 'Sarabun', sans-serif;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  /* aliases for existing JS-generated class names */
  --purple-950: var(--plum-950);
  --purple-900: var(--plum-900);
  --purple-800: var(--plum-800);
  --purple-700: var(--plum-700);
  --purple-600: var(--plum-600);
  --purple-500: var(--plum-500);
  --purple-400: var(--plum-400);
  --purple-300: var(--plum-300);
  --purple-200: var(--plum-200);
  --purple-100: var(--plum-100);
  --purple-50: var(--plum-50);
  --off-white: var(--paper);
  --text: var(--ink);
  --text-muted: var(--muted);
  --border: var(--line);
  --gold-soft: #f0df9a;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; background: #2a1444; }
body {
  font-family: var(--font-body);
  color: var(--ink);
  background:
    radial-gradient(1200px 600px at 10% -10%, rgba(154, 99, 209, 0.16), transparent 55%),
    radial-gradient(900px 500px at 100% 0%, rgba(201, 162, 74, 0.1), transparent 45%),
    linear-gradient(180deg, #ffffff 0%, var(--paper) 40%, #f3eafb 100%);
  line-height: 1.65;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
html:has(body.login-page) { background: #2a1444; min-height: 100%; overflow-x: hidden; overflow-y: auto; }
body.login-page {
  min-height: 100dvh;
  height: auto;
  max-height: none;
  overflow-x: hidden;
  overflow-y: auto;
  background-color: #2a1444;
  background-attachment: fixed;
}
body:not(.login-page) {
  background:
    radial-gradient(900px 400px at 100% 0%, rgba(154, 99, 209, 0.08), transparent 50%),
    linear-gradient(180deg, #f7f1fc 0%, #fbf8fe 45%, #f4ecfa 100%);
}
html:has(body:not(.login-page)) { background: #f7f1fc; overflow: auto; }

h1, h2, h3, h4, h5, h6, .brand, .display {
  font-family: var(--font-display);
  font-weight: 700;
  line-height: 1.25;
  letter-spacing: -0.02em;
}
a { color: var(--plum-600); text-decoration: none; transition: color .2s; }
a:hover { color: var(--plum-800); }
img { max-width: 100%; display: block; }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; border: none; background: none; }

.container { width: min(1120px, 92%); margin-inline: auto; }
.muted { color: var(--muted); }
.text-center { text-align: center; }
.mt-1 { margin-top: .5rem; }
.mt-2 { margin-top: 1rem; }
.mt-3 { margin-top: 1.5rem; }
.mt-4 { margin-top: 2rem; }
.mb-2 { margin-bottom: 1rem; }
.gap-2 { gap: 1rem; }
.flex { display: flex; }
.flex-wrap { flex-wrap: wrap; }
.items-center { align-items: center; }
.justify-between { justify-content: space-between; }
.grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.35rem; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.35rem; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.1rem; }
@media (max-width: 960px) {
  .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
}

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
  padding: .78rem 1.35rem; border-radius: 999px;
  font-family: var(--font-display); font-weight: 600; font-size: .93rem;
  transition: transform .22s var(--ease), box-shadow .22s var(--ease), background .22s, filter .22s;
}
.btn:hover { transform: translateY(-2px); }
.btn:active { transform: translateY(0); }
.btn-primary {
  background: linear-gradient(135deg, #6b34a8 0%, #4b2478 55%, #3a1d5c 100%);
  color: #fff;
  box-shadow: var(--shadow-glow);
  border: 1px solid rgba(255,255,255,.12);
}
.btn-primary:hover { color: #fff; filter: brightness(1.06); box-shadow: 0 16px 44px rgba(94, 45, 150, 0.38); }
.btn-outline {
  border: 1.5px solid rgba(94, 45, 150, 0.35);
  color: var(--plum-700);
  background: rgba(255,255,255,.7);
  backdrop-filter: blur(8px);
}
.btn-outline:hover { background: var(--plum-50); color: var(--plum-800); border-color: var(--plum-500); }
.btn-ghost { color: var(--plum-700); background: rgba(238, 224, 248, 0.85); }
.btn-ghost:hover { background: var(--plum-200); }
.btn-danger { background: linear-gradient(135deg, #d95555, #b83232); color: #fff; }
.btn-success { background: linear-gradient(135deg, #1caa78, #0f8a62); color: #fff; }
.btn-sm { padding: .45rem .95rem; font-size: .84rem; }
.btn-block { width: 100%; }

/* Forms */
.form-group { margin-bottom: 1rem; }
.form-group label {
  display: block; font-weight: 600; margin-bottom: .4rem;
  font-size: .9rem; color: var(--plum-900); font-family: var(--font-display);
}
.form-control {
  width: 100%; padding: .78rem 1.05rem;
  border: 1.5px solid rgba(94, 45, 150, 0.16);
  border-radius: 14px; background: rgba(255,255,255,.92); color: var(--ink);
  transition: border-color .2s, box-shadow .2s, background .2s;
}
.form-control:focus {
  outline: none; border-color: var(--plum-400);
  box-shadow: 0 0 0 4px rgba(122, 63, 184, 0.14);
  background: #fff;
}
textarea.form-control { min-height: 108px; resize: vertical; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
@media (max-width: 640px) { .form-row { grid-template-columns: 1fr; } }

/* Badges */
.badge {
  display: inline-flex; align-items: center; padding: .28rem .7rem;
  border-radius: 999px; font-size: .76rem; font-weight: 600;
  font-family: var(--font-display); letter-spacing: .01em;
}
.badge-purple { background: linear-gradient(135deg, #efe3f9, #e4d0f4); color: var(--plum-800); }
.badge-success { background: #d9f5ea; color: #0b5f44; }
.badge-warning { background: #fff1d6; color: #8a5608; }
.badge-danger { background: #ffe1e1; color: #8f2424; }
.badge-info { background: #e3edff; color: #1e4db0; }
.badge-gold { background: linear-gradient(135deg, #fff4c8, #f5e4a0); color: #7a5a10; border: 1px solid rgba(201,162,74,.35); }

/* Panels */
.panel {
  background: rgba(255,255,255,.82);
  backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,.7);
  border-radius: var(--radius);
  padding: 1.45rem;
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
}
.panel::before {
  content: '';
  position: absolute; inset: 0 0 auto 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.9), transparent);
}
.panel-header {
  display: flex; align-items: center; justify-content: space-between;
  gap: 1rem; margin-bottom: 1.15rem; flex-wrap: wrap;
}
.panel-header h2, .panel-header h3 {
  font-size: 1.12rem; color: var(--plum-900);
  position: relative; padding-left: .75rem;
}
.panel-header h2::before, .panel-header h3::before {
  content: '';
  position: absolute; left: 0; top: .2em; bottom: .2em; width: 3px;
  border-radius: 99px;
  background: linear-gradient(180deg, var(--gold), var(--plum-500));
}

.stat-card {
  background: linear-gradient(160deg, rgba(255,255,255,.95), rgba(248,242,252,.9));
  border: 1px solid rgba(94, 45, 150, 0.1);
  border-radius: var(--radius);
  padding: 1.35rem 1.3rem 1.25rem;
  position: relative; overflow: hidden;
  box-shadow: var(--shadow);
  transition: transform .28s var(--ease), box-shadow .28s;
}
.stat-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 4px;
  background: linear-gradient(90deg, var(--plum-600), var(--plum-400), var(--gold));
}
.stat-card::after {
  content: '';
  position: absolute; width: 120px; height: 120px; border-radius: 50%;
  background: radial-gradient(circle, rgba(154, 99, 209, 0.14), transparent 70%);
  right: -30px; bottom: -40px; pointer-events: none;
}
.stat-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
.stat-card .label { font-size: .84rem; color: var(--muted); font-weight: 600; font-family: var(--font-display); }
.stat-card .value {
  font-family: var(--font-display); font-size: 2rem; font-weight: 800;
  color: var(--plum-800); margin-top: .3rem; letter-spacing: -0.03em;
}
.stat-card .trend { font-size: .8rem; margin-top: .4rem; font-weight: 600; }
.trend.up { color: var(--success); }
.trend.down { color: var(--danger); }

/* Tables */
.table-wrap { overflow-x: auto; border-radius: 14px; }
table.data-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: .92rem; }
table.data-table th, table.data-table td {
  padding: .85rem .9rem; text-align: left; border-bottom: 1px solid rgba(94, 45, 150, 0.1);
}
table.data-table th {
  font-family: var(--font-display); font-weight: 600; color: var(--plum-800);
  background: linear-gradient(180deg, #f7eefc, #f3e8fa); white-space: nowrap;
}
table.data-table th:first-child { border-radius: 12px 0 0 0; }
table.data-table th:last-child { border-radius: 0 12px 0 0; }
table.data-table tr:hover td { background: rgba(248, 242, 252, 0.75); }

/* Tabs */
.tabs {
  display: flex; gap: .4rem; flex-wrap: wrap;
  border-bottom: 2px solid rgba(94, 45, 150, 0.1); margin-bottom: 1.25rem;
}
.tab-btn {
  padding: .7rem 1.15rem; font-family: var(--font-display); font-weight: 600;
  color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -2px;
  border-radius: 12px 12px 0 0; transition: all .2s;
}
.tab-btn:hover { color: var(--plum-700); background: rgba(238, 224, 248, 0.5); }
.tab-btn.active {
  color: var(--plum-700); border-bottom-color: var(--plum-600);
  background: linear-gradient(180deg, rgba(238,224,248,.7), transparent);
}
.tab-panel { display: none; animation: rise .4s var(--ease); }
.tab-panel.active { display: block; }

@keyframes rise {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes floaty {
  0%, 100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-14px) scale(1.03); }
}
@keyframes shimmer {
  0% { background-position: 0% 50%; }
  100% { background-position: 100% 50%; }
}
@keyframes spinSoft {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
@keyframes goldShimmer {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
@keyframes beamSweep {
  0%, 100% { opacity: .35; transform: translateX(-8%) rotate(12deg); }
  50% { opacity: .7; transform: translateX(8%) rotate(12deg); }
}
@keyframes cardSheen {
  0% { transform: translateX(-120%) skewX(-18deg); }
  100% { transform: translateX(220%) skewX(-18deg); }
}

/* Toast / Modal */
.toast-wrap {
  position: fixed; top: 1.1rem; right: 1.1rem; z-index: 9999;
  display: flex; flex-direction: column; gap: .55rem;
}
.toast {
  background: linear-gradient(135deg, var(--plum-900), var(--plum-700));
  color: #fff; padding: .95rem 1.25rem; border-radius: 16px;
  box-shadow: var(--shadow-lg); animation: rise .3s var(--ease);
  max-width: 340px; font-size: .92rem; border: 1px solid rgba(255,255,255,.1);
}
.toast.success { background: linear-gradient(135deg, #0f8a62, #14a574); }
.toast.error { background: linear-gradient(135deg, #b83232, #d95555); }

.modal-overlay {
  position: fixed; inset: 0; z-index: 9000; display: none;
  align-items: center; justify-content: center; padding: 1rem;
  background: rgba(20, 8, 31, 0.55); backdrop-filter: blur(8px);
}
.modal-overlay.open { display: flex; animation: fadeIn .2s; }
.modal {
  background: linear-gradient(180deg, #fff, #fbf7ff);
  border-radius: 24px; width: min(520px, 100%); max-height: 90vh;
  overflow-y: auto; padding: 1.7rem; box-shadow: var(--shadow-lg);
  animation: rise .35s var(--ease); border: 1px solid rgba(255,255,255,.8);
}
.modal.modal-lg { width: min(880px, 100%); }
.modal h3 { color: var(--plum-900); margin-bottom: 1rem; font-size: 1.25rem; }
.modal:not(.modal-lg) { width: min(480px, 100%); }

/* App shell */
.app-shell { display: flex; min-height: 100vh; }
.sidebar {
  width: var(--sidebar-w);
  background:
    radial-gradient(500px 280px at 0% 0%, rgba(201, 162, 74, 0.18), transparent 55%),
    linear-gradient(175deg, #2a1342 0%, #3a1d5c 42%, #4b2478 100%);
  color: #fff; position: fixed; top: 0; left: 0; bottom: 0; z-index: 100;
  display: flex; flex-direction: column; padding: 1.35rem 1.05rem;
  overflow-y: auto; border-right: 1px solid rgba(255,255,255,.06);
}
.sidebar .brand-block {
  display: flex; align-items: center; gap: .8rem;
  padding: .55rem .7rem 1.3rem; border-bottom: 1px solid rgba(255,255,255,.1);
  margin-bottom: 1.1rem;
}
.sidebar .brand-mark {
  width: 48px; height: 48px; border-radius: 50%;
  background: #fff;
  display: grid; place-items: center; flex-shrink: 0;
  box-shadow: 0 0 0 2px rgba(240, 223, 154, 0.55), 0 8px 20px rgba(0,0,0,.25);
  overflow: hidden; padding: 3px;
}
.sidebar .brand-mark img {
  width: 100%; height: 100%; object-fit: contain; border-radius: 50%;
}
.sidebar .brand-text { font-family: var(--font-display); font-weight: 700; font-size: .98rem; line-height: 1.3; }
.sidebar .brand-text small { display: block; font-weight: 400; opacity: .72; font-size: .72rem; margin-top: .15rem; }

.nav-list { list-style: none; flex: 1; }
.nav-list a {
  display: flex; align-items: center; gap: .75rem;
  padding: .78rem .9rem; color: rgba(255,255,255,.78); border-radius: 14px;
  font-family: var(--font-display); font-weight: 500; font-size: .9rem;
  margin-bottom: .28rem; transition: all .22s var(--ease);
}
.nav-list a:hover { background: rgba(255,255,255,.1); color: #fff; transform: translateX(3px); }
.nav-list a.active {
  background: linear-gradient(90deg, rgba(255,255,255,.16), rgba(255,255,255,.06));
  color: #fff; box-shadow: inset 3px 0 0 var(--gold);
}
.nav-icon { width: 1.3rem; text-align: center; opacity: .95; font-size: 1.05rem; flex-shrink: 0; }
.nav-label { line-height: 1.35; }

/* Featured student menus — catch the eye on login */
.nav-list a.nav-featured {
  position: relative;
  display: flex;
  align-items: center;
  gap: .75rem;
  margin: .45rem 0;
  padding: .9rem .95rem;
  color: #fff;
  background:
    linear-gradient(135deg, rgba(201, 162, 74, 0.28), rgba(122, 63, 184, 0.35) 55%, rgba(255,255,255,0.08));
  border: 1px solid rgba(240, 223, 154, 0.55);
  box-shadow:
    0 0 0 1px rgba(201, 162, 74, 0.15),
    0 8px 22px rgba(0, 0, 0, 0.22),
    inset 0 1px 0 rgba(255,255,255,.12);
  animation: navFeaturePulse 2.4s ease-in-out infinite;
}
.nav-list a.nav-featured:hover {
  transform: translateX(4px) scale(1.02);
  border-color: rgba(240, 223, 154, 0.9);
  background:
    linear-gradient(135deg, rgba(201, 162, 74, 0.4), rgba(122, 63, 184, 0.45) 55%, rgba(255,255,255,0.12));
  box-shadow: 0 10px 28px rgba(201, 162, 74, 0.28);
}
.nav-list a.nav-featured.active {
  box-shadow:
    inset 3px 0 0 #f0df9a,
    0 0 0 1px rgba(240, 223, 154, 0.45),
    0 10px 26px rgba(201, 162, 74, 0.3);
  background:
    linear-gradient(135deg, rgba(201, 162, 74, 0.45), rgba(94, 45, 150, 0.55));
}
.nav-list a.nav-featured .nav-icon {
  font-size: 1.2rem;
  filter: drop-shadow(0 0 6px rgba(240, 223, 154, 0.65));
}
.nav-list a.nav-featured .nav-label {
  font-weight: 700;
  background: linear-gradient(135deg, #fff7d1, #f0df9a 45%, #fff);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: #f0df9a;
}
.nav-hot {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-left: auto;
  width: 1.55rem;
  height: 1.55rem;
  padding: 0;
  border-radius: 999px;
  font-size: .85rem;
  line-height: 1;
  color: #5c3d0a;
  background: linear-gradient(145deg, #fff7d6, #c9a24a);
  box-shadow: 0 2px 10px rgba(201, 162, 74, 0.5), inset 0 1px 0 rgba(255,255,255,.55);
  flex-shrink: 0;
  animation: navHotTwinkle 1.8s ease-in-out infinite;
}
@keyframes navHotTwinkle {
  0%, 100% { transform: scale(1); filter: brightness(1); }
  50% { transform: scale(1.12); filter: brightness(1.15); }
}
@keyframes navFeaturePulse {
  0%, 100% { box-shadow: 0 0 0 1px rgba(201, 162, 74, 0.2), 0 8px 22px rgba(0,0,0,.22); }
  50% { box-shadow: 0 0 0 2px rgba(240, 223, 154, 0.55), 0 10px 28px rgba(201, 162, 74, 0.35); }
}
@keyframes navFeaturePop {
  0% { transform: scale(0.92) translateX(-6px); opacity: .4; }
  60% { transform: scale(1.05) translateX(2px); opacity: 1; }
  100% { transform: scale(1) translateX(0); opacity: 1; }
}

.sidebar-footer { border-top: 1px solid rgba(255,255,255,.1); padding-top: 1rem; margin-top: 1rem; }
.user-chip { display: flex; align-items: center; gap: .7rem; padding: .55rem; margin-bottom: .8rem; }
.user-avatar {
  width: 40px; height: 40px; border-radius: 50%;
  background: linear-gradient(145deg, var(--plum-400), var(--plum-600));
  display: grid; place-items: center; font-family: var(--font-display);
  font-weight: 700; font-size: .9rem; border: 2px solid rgba(255,255,255,.25);
}
.user-meta { font-size: .82rem; line-height: 1.3; opacity: .9; }
.user-meta strong { display: block; font-size: .92rem; }

.main-area { margin-left: var(--sidebar-w); flex: 1; min-width: 0; }
.topbar {
  height: var(--nav-h);
  background: rgba(255,255,255,.72); backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(94, 45, 150, 0.1);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 1.6rem; position: sticky; top: 0; z-index: 50;
}
.topbar h1 {
  font-size: 1.28rem; color: var(--plum-900);
  background: linear-gradient(135deg, var(--plum-900), var(--plum-600));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.page-content { padding: 1.65rem; animation: rise .45s var(--ease); }
.menu-toggle {
  display: none; width: 44px; height: 44px; border-radius: 14px;
  background: var(--plum-100); color: var(--plum-800); font-size: 1.2rem;
}
@media (max-width: 900px) {
  .sidebar { transform: translateX(-105%); transition: transform .32s var(--ease); }
  .sidebar.open { transform: translateX(0); box-shadow: var(--shadow-lg); }
  .main-area { margin-left: 0; }
  .menu-toggle { display: grid; place-items: center; }
  .sidebar-backdrop {
    display: none; position: fixed; inset: 0;
    background: rgba(20, 8, 31, .45); z-index: 90; backdrop-filter: blur(2px);
  }
  .sidebar-backdrop.open { display: block; }
}

/* ========== LOGIN ========== */
.login-page {
  min-height: 100dvh;
  background:
    radial-gradient(ellipse 70% 45% at 50% 0%, rgba(240, 223, 154, 0.28), transparent 55%),
    radial-gradient(ellipse 50% 40% at 0% 25%, rgba(154, 99, 209, 0.4), transparent 60%),
    radial-gradient(ellipse 45% 35% at 100% 40%, rgba(94, 45, 150, 0.45), transparent 55%),
    radial-gradient(ellipse 35% 28% at 80% 12%, rgba(201, 162, 74, 0.22), transparent 50%),
    linear-gradient(180deg, #4b2478 0%, #3a1d5c 45%, #2a1444 100%);
  position: relative;
  overflow-x: hidden;
}
.login-page::before {
  content: '';
  position: absolute; inset: 0; pointer-events: none; opacity: .35;
  background-image:
    radial-gradient(rgba(255, 248, 220, 0.12) 1.2px, transparent 1.2px);
  background-size: 28px 28px;
  mask-image: radial-gradient(ellipse 85% 70% at 50% 30%, #000 15%, transparent 78%);
}
.login-page::after {
  content: '';
  position: absolute; width: 520px; height: 520px; border-radius: 50%;
  border: 1.5px solid rgba(240, 223, 154, 0.22);
  box-shadow: inset 0 0 0 18px rgba(201, 162, 74, 0.06);
  top: -180px; right: -160px; pointer-events: none;
  animation: spinSoft 48s linear infinite;
}
#login-root.active {
  min-height: 100dvh;
  height: auto;
  max-height: none;
  overflow: visible;
}
.login-stage {
  position: relative; z-index: 2;
  min-height: 100dvh;
  height: auto;
  max-height: none;
  display: flex; flex-direction: column;
  overflow: visible;
}
.login-beam {
  position: absolute; inset: -8% 18% auto; height: 42%;
  background: linear-gradient(105deg, transparent, rgba(240, 223, 154, 0.18), rgba(201, 162, 74, 0.14), transparent);
  pointer-events: none; filter: blur(22px);
  animation: beamSweep 9s ease-in-out infinite;
  z-index: 1;
}
.login-ring {
  position: absolute; border-radius: 50%; pointer-events: none; z-index: 1;
  border: 1px solid rgba(240, 223, 154, 0.18);
}
.login-ring.r1 {
  width: 320px; height: 320px; left: -140px; top: 55%;
  border-color: rgba(201, 162, 74, 0.22);
  animation: spinSoft 55s linear infinite reverse;
}
.login-ring.r2 {
  width: 200px; height: 200px; right: 6%; top: 58%;
  border-style: dashed; opacity: .4;
  animation: spinSoft 30s linear infinite;
}
.login-orb {
  position: absolute; border-radius: 50%; filter: blur(70px);
  opacity: .45; pointer-events: none; animation: floaty 9s ease-in-out infinite; z-index: 1;
}
.login-orb.o1 { width: 360px; height: 360px; background: #7a3fb8; top: -120px; right: -90px; }
.login-orb.o2 { width: 280px; height: 280px; background: #4b2478; top: 35%; left: -120px; animation-delay: 1.5s; }
.login-orb.o3 {
  width: 200px; height: 200px; background: rgba(201, 162, 74, 0.55);
  top: 28%; right: 8%; animation-delay: 3s; opacity: .35;
}

.login-header {
  position: relative; z-index: 2;
  padding: clamp(1.2rem, 3.5vh, 2.2rem) 0 0.4rem;
  text-align: center;
  flex-shrink: 0;
}
.school-crest {
  width: clamp(104px, 14vw, 132px); height: clamp(104px, 14vw, 132px);
  margin: 0 auto 0.85rem;
  border-radius: 50%;
  display: grid; place-items: center;
  position: relative;
  animation: rise .7s var(--ease), logoFloat 4.5s ease-in-out 0.7s infinite;
  background:
    radial-gradient(circle at 32% 28%, #fff8e8 0%, #f0e4f8 48%, #d7b8ef 100%);
  box-shadow:
    0 0 0 4px rgba(240, 223, 154, 0.85),
    0 0 0 8px rgba(201, 162, 74, 0.35),
    0 0 0 14px rgba(255, 255, 255, 0.08),
    0 22px 50px rgba(20, 8, 40, 0.45),
    0 0 60px rgba(201, 162, 74, 0.35);
}
.school-crest::before {
  content: '';
  position: absolute; inset: -14px; border-radius: 50%;
  background: conic-gradient(from 0deg, transparent 0%, rgba(240,223,154,.95) 18%, rgba(154,99,209,.55) 42%, transparent 58%, rgba(201,162,74,.85) 78%, transparent 100%);
  z-index: -1;
  animation: spinSoft 7s linear infinite;
  opacity: .95;
}
.school-crest::after {
  content: '';
  position: absolute; inset: -28px; border-radius: 50%;
  background: radial-gradient(circle, rgba(240, 223, 154, 0.35), rgba(154, 99, 209, 0.2) 42%, transparent 70%);
  z-index: -2;
  animation: logoPulse 3.2s ease-in-out infinite;
}
.school-crest img {
  width: 92%; height: 92%;
  object-fit: contain;
  border-radius: 50%;
  position: relative; z-index: 1;
  filter: drop-shadow(0 4px 10px rgba(20, 8, 40, 0.3));
  transition: transform .35s var(--ease), filter .35s;
}
.school-crest:hover img {
  transform: scale(1.05);
  filter: drop-shadow(0 8px 18px rgba(20, 8, 40, 0.4));
}
.school-crest .crest-fallback {
  display: none;
  position: absolute; inset: 0; z-index: 0;
  place-items: center;
  font-family: var(--font-display); font-weight: 800;
  font-size: 2.4rem; color: var(--plum-800);
  letter-spacing: .04em;
}
.school-crest.no-img .crest-fallback { display: grid; }
.school-crest.no-img img { display: none; }
@keyframes logoFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}
@keyframes logoPulse {
  0%, 100% { opacity: .55; transform: scale(0.96); }
  50% { opacity: 1; transform: scale(1.05); }
}
.login-header .brand {
  font-size: clamp(1.75rem, 4.2vw, 2.6rem);
  background: linear-gradient(110deg, #fff4c8 0%, #f0df9a 28%, #c9a24a 48%, #ffe9a8 72%, #e8d48b 100%);
  background-size: 220% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: rise .7s .08s both var(--ease), goldShimmer 5.5s ease-in-out infinite;
  filter: drop-shadow(0 4px 18px rgba(0, 0, 0, 0.35));
  letter-spacing: -0.015em;
  font-weight: 800;
  line-height: 1.2;
}
.login-header .brand-line {
  width: min(220px, 48%);
  height: 3px;
  margin: 1rem auto 0;
  border-radius: 999px;
  background: linear-gradient(90deg, transparent, #f0df9a, #c9a24a, #f0df9a, transparent);
  animation: rise .7s .14s both var(--ease);
  opacity: .9;
}
.login-header .tagline {
  color: #f0e4f8; font-size: 1.08rem; margin-top: .85rem;
  animation: rise .7s .16s both var(--ease); max-width: 34ch; margin-inline: auto;
  font-family: var(--font-display); font-weight: 500;
}
.login-kicker {
  display: inline-flex; align-items: center; gap: .45rem;
  margin-top: .9rem; padding: .35rem .85rem; border-radius: 999px;
  background: rgba(255,255,255,.12); border: 1px solid rgba(240,223,154,.45);
  color: #f0df9a; font-family: var(--font-display); font-weight: 600; font-size: .8rem;
  animation: rise .7s .22s both var(--ease);
}

.role-section {
  position: relative; z-index: 2;
  padding: 0.6rem 0 0.4rem;
  flex: 1;
  min-height: 0;
  display: flex; flex-direction: column; justify-content: center;
  overflow: visible;
}
.role-section > .section-label {
  text-align: center; font-family: var(--font-display); font-weight: 600;
  color: #f3e8fa; margin-bottom: 1.2rem;
  animation: rise .65s .25s both var(--ease); letter-spacing: .03em;
  font-size: 1.05rem;
  text-shadow: 0 2px 12px rgba(0,0,0,.25);
}
.role-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.25rem;
  max-width: 1080px; margin-inline: auto;
}
@media (max-width: 1000px) { .role-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 520px) { .role-grid { grid-template-columns: 1fr; max-width: 360px; } }

.role-card {
  background:
    linear-gradient(165deg, rgba(88, 42, 140, 0.72) 0%, rgba(58, 29, 92, 0.78) 100%);
  backdrop-filter: blur(18px);
  border: 1px solid rgba(240, 223, 154, 0.28);
  border-radius: 28px; padding: 2rem 1.25rem 1.7rem; text-align: center; cursor: pointer;
  transition: transform .35s var(--ease), box-shadow .35s, border-color .35s, background .35s;
  animation: rise .6s both var(--ease); position: relative; overflow: hidden;
  box-shadow:
    0 16px 44px rgba(12, 4, 28, 0.35),
    inset 0 1px 0 rgba(255,255,255,.12);
}
.role-card:nth-child(1) { animation-delay: .28s; }
.role-card:nth-child(2) { animation-delay: .36s; }
.role-card:nth-child(3) { animation-delay: .44s; }
.role-card:nth-child(4) { animation-delay: .52s; }
.role-card::before {
  content: '';
  position: absolute; inset: 0 0 auto 0; height: 4px;
  background: var(--role-accent, linear-gradient(90deg, #9a63d1, #c9a24a));
  opacity: 1;
}
.role-card::after {
  content: '';
  position: absolute; top: 0; left: 0; width: 45%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.18), transparent);
  transform: translateX(-120%) skewX(-18deg);
  pointer-events: none;
}
.role-card:hover {
  transform: translateY(-12px) scale(1.02);
  box-shadow: 0 28px 60px rgba(12, 4, 28, 0.45);
  border-color: rgba(240, 223, 154, 0.55);
  background: linear-gradient(165deg, rgba(110, 55, 168, 0.85) 0%, rgba(74, 36, 120, 0.9) 100%);
}
.role-card:hover::after { animation: cardSheen .85s var(--ease); }
.role-card.selected {
  border-color: #f0df9a;
  box-shadow: 0 0 0 3px rgba(240, 223, 154, 0.28), 0 24px 50px rgba(12, 4, 28, 0.4);
  background: linear-gradient(165deg, rgba(122, 63, 184, 0.92) 0%, rgba(74, 36, 120, 0.95) 100%);
  transform: translateY(-6px);
}
.role-card[data-role="admin"] { --role-accent: linear-gradient(90deg, #d7b8ef, #9a63d1); }
.role-card[data-role="teacher"] { --role-accent: linear-gradient(90deg, #9ec0ff, #5b8ef0); }
.role-card[data-role="council"] { --role-accent: linear-gradient(90deg, #f0df9a, #c9a24a); }
.role-card[data-role="student"] { --role-accent: linear-gradient(90deg, #7de0bc, #2fad82); }
.role-icon {
  width: 84px; height: 84px; margin: 0 auto 1.15rem; border-radius: 26px;
  display: grid; place-items: center; font-size: 2.15rem;
  background: linear-gradient(160deg, rgba(255,255,255,.22) 0%, rgba(240,223,154,.18) 100%);
  color: #fff; transition: transform .35s var(--ease), box-shadow .35s;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.25),
    0 10px 22px rgba(12, 4, 28, 0.28);
  border: 1px solid rgba(240, 223, 154, 0.28);
}
.role-card[data-role="admin"] .role-icon { background: linear-gradient(160deg, #8b5cb8, #5e2d96); }
.role-card[data-role="teacher"] .role-icon { background: linear-gradient(160deg, #5b8ef0, #2f6fed); }
.role-card[data-role="council"] .role-icon { background: linear-gradient(160deg, #e8d48b, #c9a24a); }
.role-card[data-role="student"] .role-icon { background: linear-gradient(160deg, #4ec9a0, #0f8a62); }
.role-card:hover .role-icon { transform: scale(1.1) rotate(-5deg); box-shadow: 0 14px 28px rgba(12, 4, 28, 0.35); }
.role-card h3 {
  font-size: 1.12rem; color: #fffdf8; margin-bottom: 0;
  letter-spacing: -0.01em; min-height: 2.6em;
  display: grid; place-items: center;
  text-shadow: 0 2px 10px rgba(0,0,0,.25);
}
.role-card p { font-size: .9rem; color: rgba(255,255,255,.75); line-height: 1.5; }

.login-box {
  max-width: 420px; width: 100%; margin: 0.6rem auto 0;
  background: linear-gradient(165deg, rgba(88, 42, 140, 0.88) 0%, rgba(42, 20, 68, 0.94) 100%);
  backdrop-filter: blur(20px);
  border-radius: 28px; padding: 1.35rem 1.45rem 1.5rem;
  border: 1px solid rgba(240, 223, 154, 0.38);
  box-shadow: 0 24px 60px rgba(12, 4, 28, 0.45), inset 0 1px 0 rgba(255,255,255,.12);
  display: none; animation: rise .4s var(--ease);
  position: relative; overflow: visible;
}
.login-box::before {
  content: '';
  position: absolute; inset: 0 0 auto 0; height: 4px;
  background: linear-gradient(90deg, #9a63d1, #f0df9a, #c9a24a, #9a63d1);
}
.login-box.show { display: block; }
.login-back {
  display: inline-flex; align-items: center; gap: .4rem;
  margin: 0 0 1rem; padding: .45rem .85rem;
  border-radius: 999px;
  font-family: var(--font-display); font-weight: 600; font-size: .84rem;
  color: #f0df9a;
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(240, 223, 154, 0.32);
  transition: background .2s, transform .2s, border-color .2s;
}
.login-back:hover {
  background: rgba(240, 223, 154, 0.16);
  border-color: rgba(240, 223, 154, 0.55);
  transform: translateX(-2px);
}
.login-box-head { text-align: center; margin-bottom: 1.15rem; }
.login-role-badge {
  width: 64px; height: 64px; margin: 0 auto .75rem;
  border-radius: 20px; display: grid; place-items: center;
  font-size: 1.7rem;
  background: linear-gradient(160deg, rgba(240,223,154,.28), rgba(154,99,209,.35));
  border: 1px solid rgba(240, 223, 154, 0.4);
  box-shadow: 0 10px 24px rgba(12, 4, 28, 0.3);
}
.login-box h3 {
  text-align: center; color: #f0df9a; margin-bottom: .35rem;
  font-size: clamp(1.1rem, 2.8vw, 1.3rem); line-height: 1.35;
}
.login-hint { text-align: center; font-size: .88rem; color: rgba(243, 232, 250, 0.78); margin-bottom: 0; }
.login-box .form-group { margin-bottom: .9rem; }
.login-box .form-group label { color: #f3e8fa; font-size: .88rem; }
.login-box .form-control {
  background: rgba(255,255,255,.12);
  border: 1.5px solid rgba(240, 223, 154, 0.28);
  color: #fff;
  border-radius: 14px;
  padding: .82rem 1.05rem;
}
.login-box .form-control::placeholder { color: rgba(255,255,255,.45); }
.login-box .form-control:focus {
  background: rgba(255,255,255,.16);
  border-color: #f0df9a;
  box-shadow: 0 0 0 4px rgba(240, 223, 154, 0.18);
}
.login-box .btn-primary {
  margin-top: .35rem;
  background: linear-gradient(135deg, #c9a24a 0%, #e8d48b 45%, #a8842e 100%);
  color: #2a1444;
  border: none;
  box-shadow: 0 12px 28px rgba(201, 162, 74, 0.35);
  font-weight: 700;
}
.login-box .btn-primary:hover {
  filter: brightness(1.05);
  box-shadow: 0 14px 32px rgba(201, 162, 74, 0.45);
  color: #2a1444;
}
.login-box .login-demo {
  text-align: center; margin: .85rem 0 0;
  font-size: .76rem; color: rgba(243, 232, 250, 0.55); line-height: 1.45;
}
#login-root.auth-step .section-label,
#login-root.auth-step .role-grid { display: none; }
#login-root.auth-step .login-header {
  padding: 0.7rem 0 0.15rem;
}
#login-root.auth-step .school-crest {
  width: 72px;
  height: 72px;
  margin-bottom: 0.4rem;
  animation: none;
}
#login-root.auth-step .school-crest::before,
#login-root.auth-step .school-crest::after {
  animation: none;
}
#login-root.auth-step .login-header .brand {
  font-size: clamp(1.2rem, 3vw, 1.55rem);
}
#login-root.auth-step .login-header .brand-line {
  margin-top: .4rem; width: min(120px, 36%); height: 2px;
}
#login-root.auth-step .role-section {
  justify-content: flex-start;
  padding: 0.25rem 0 1.2rem;
  flex: 0 0 auto;
}
#login-root.auth-step .login-box {
  margin-top: 0.55rem;
  padding: 1.15rem 1.25rem 1.25rem;
}
#login-root.auth-step .login-box-head { margin-bottom: 0.85rem; }
#login-root.auth-step .login-role-badge {
  width: 52px; height: 52px; font-size: 1.4rem; margin-bottom: .55rem;
}
#login-root.auth-step .login-back { margin-bottom: .75rem; }
#login-root.auth-step .login-footer { padding-bottom: 1.1rem; }
.login-footer {
  text-align: center; padding: 0.45rem 1.5rem 0.9rem; color: rgba(240, 223, 154, 0.75);
  font-size: .86rem; position: relative; z-index: 2;
  font-family: var(--font-display); font-weight: 500;
  flex-shrink: 0;
}

/* Calendar */
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.cal-head {
  text-align: center; font-family: var(--font-display); font-weight: 600;
  font-size: .8rem; color: var(--plum-700); padding: .45rem;
}
.cal-day {
  min-height: 76px; border: 1px solid rgba(94, 45, 150, 0.1); border-radius: 12px;
  padding: .4rem; background: rgba(255,255,255,.85); font-size: .78rem; position: relative;
  transition: border-color .2s, transform .2s;
}
.cal-day:hover:not(.empty) { border-color: var(--plum-300); transform: translateY(-1px); }
.cal-day.empty { background: transparent; border-color: transparent; }
.cal-day .day-num { font-weight: 700; color: var(--plum-800); }
.cal-day.today {
  border-color: var(--plum-500);
  background: linear-gradient(160deg, #f7eefc, #fff);
  box-shadow: inset 0 0 0 1px rgba(122, 63, 184, 0.15);
}
.cal-event {
  display: block; margin-top: 3px; padding: 2px 5px; border-radius: 6px;
  background: var(--plum-200); color: var(--plum-900); font-size: .68rem;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer;
}
.cal-event.duty { background: #fde68a; }
.cal-event.council { background: #ddd6fe; }
.cal-event.activity { background: #bbf7d0; }

/* Org */
.org-chart { display: flex; flex-direction: column; align-items: center; padding: 1rem 0; overflow-x: auto; }
.org-level {
  display: flex; justify-content: center; flex-wrap: wrap; gap: 1rem;
  width: 100%; position: relative; padding: 1.3rem 0;
}
.org-level::before {
  content: ''; position: absolute; top: 0; left: 50%; width: 2px; height: 1.3rem;
  background: linear-gradient(180deg, var(--plum-300), var(--gold));
}
.org-level:first-child::before { display: none; }
.org-node {
  background: rgba(255,255,255,.92); border: 2px solid var(--plum-200);
  border-radius: 16px; padding: .95rem 1.15rem; text-align: center; min-width: 148px;
  box-shadow: var(--shadow); transition: transform .22s, border-color .22s;
}
.org-node:hover { transform: translateY(-4px); border-color: var(--plum-500); }
.org-node.top {
  background: linear-gradient(145deg, var(--plum-700), var(--plum-900));
  color: #fff; border-color: var(--gold);
}
.org-node.top .role { color: var(--gold-soft); }
.org-node.group-node {
  background: linear-gradient(145deg, #5e2d96, #7a3fb8);
  color: #fff; border-color: rgba(240, 223, 154, 0.55); min-width: 170px;
}
.org-node.group-node .role { color: var(--gold-soft); }
.org-node .name { font-family: var(--font-display); font-weight: 700; font-size: .95rem; }
.org-node .role { font-size: .78rem; color: var(--muted); margin-top: .15rem; }

/* Videos */
.video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1.15rem; }
.video-card {
  background: rgba(255,255,255,.9); border: 1px solid rgba(94, 45, 150, 0.1);
  border-radius: var(--radius); overflow: hidden;
  transition: transform .28s var(--ease), box-shadow .28s; cursor: pointer;
  box-shadow: var(--shadow);
}
.video-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-lg); }
.video-thumb {
  aspect-ratio: 16/9;
  background:
    radial-gradient(circle at 30% 30%, rgba(201,162,74,.25), transparent 40%),
    linear-gradient(135deg, #4b2478, #7a3fb8 55%, #9a63d1);
  display: grid; place-items: center; color: #fff; position: relative;
}
.video-thumb .play {
  width: 54px; height: 54px; border-radius: 50%;
  background: rgba(255,255,255,.22); backdrop-filter: blur(6px);
  display: grid; place-items: center; border: 2px solid rgba(255,255,255,.85);
  transition: transform .22s; font-size: 1.1rem;
}
.video-card:hover .play { transform: scale(1.12); }
.video-body { padding: 1.05rem 1.1rem 1.15rem; }
.video-body h4 { font-size: 1rem; color: var(--plum-900); margin-bottom: .3rem; }
.video-body .meta { font-size: .8rem; color: var(--muted); }

.subject-pills { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1.25rem; }
.subject-pill {
  padding: .45rem .95rem; border-radius: 999px;
  border: 1.5px solid rgba(94, 45, 150, 0.14);
  font-family: var(--font-display); font-weight: 600; font-size: .82rem;
  color: var(--muted); background: rgba(255,255,255,.85); transition: all .2s;
}
.subject-pill:hover, .subject-pill.active {
  background: linear-gradient(135deg, var(--plum-600), var(--plum-800));
  border-color: transparent; color: #fff; box-shadow: 0 8px 18px rgba(94, 45, 150, 0.25);
}

/* Activities */
.activity-card {
  border: 1px solid rgba(94, 45, 150, 0.12); border-radius: var(--radius);
  padding: 1.15rem; background: rgba(255,255,255,.88);
  display: flex; flex-direction: column; gap: .65rem;
  transition: border-color .22s, box-shadow .22s, transform .22s;
  box-shadow: var(--shadow);
}
.activity-card:hover {
  border-color: rgba(154, 99, 209, 0.45); box-shadow: var(--shadow-lg);
  transform: translateY(-3px);
}
.activity-card h4 { color: var(--plum-900); font-size: 1.05rem; }
.activity-cover {
  width: 100%; aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden;
  background: linear-gradient(135deg, #efe6f8, #f7f2fc); margin: -.2rem 0 .2rem;
  cursor: zoom-in; position: relative;
}
.activity-cover img, .feed-media img, .media-preview img {
  width: 100%; height: 100%; object-fit: cover; display: block;
}
.feed-media {
  margin: .55rem 0; border-radius: 14px; overflow: hidden; max-height: 280px;
  background: #f3ebf9; cursor: zoom-in;
}
.feed-media img { max-height: 280px; width: 100%; object-fit: cover; }
.media-skeleton {
  display: grid; place-items: center; height: 100%; min-height: 120px;
  color: var(--muted); font-size: .85rem;
}
.media-preview {
  margin-top: .55rem; border-radius: 14px; overflow: hidden;
  border: 1.5px dashed var(--plum-300); background: #faf7fd;
  aspect-ratio: 16 / 9; display: none; position: relative;
}
.media-preview.is-on { display: block; }
.media-preview .clear-img {
  position: absolute; top: .5rem; right: .5rem; z-index: 2;
}
.team-progress {
  height: 8px; border-radius: 999px; background: var(--plum-100); overflow: hidden; margin: .15rem 0;
}
.team-progress > span {
  display: block; height: 100%; border-radius: inherit;
  background: linear-gradient(90deg, var(--plum-500), #9b5de5);
  transition: width .4s ease;
}
.img-lightbox {
  position: fixed; inset: 0; z-index: 9999; background: rgba(20, 10, 35, .82);
  display: grid; place-items: center; padding: 1.5rem; cursor: zoom-out;
}
.img-lightbox img {
  max-width: min(960px, 100%); max-height: 90vh; border-radius: 16px;
  box-shadow: 0 20px 60px rgba(0,0,0,.35); object-fit: contain; background: #111;
}
.team-slot {
  display: flex; align-items: center; gap: .5rem; flex-wrap: wrap;
  padding: .75rem; background: linear-gradient(135deg, #f7eefc, #fbf7ff);
  border-radius: 14px; border: 1px solid rgba(94, 45, 150, 0.08);
}
.member-chip {
  display: inline-flex; align-items: center; gap: .3rem;
  background: #fff; border: 1px solid rgba(94, 45, 150, 0.12);
  padding: .28rem .65rem; border-radius: 999px; font-size: .8rem; font-weight: 600;
}
.sub-card {
  background: #faf7fd; border: 1px solid rgba(94, 45, 150, 0.1);
  border-radius: 14px; padding: .85rem .95rem; margin-top: .55rem;
}
.sub-card h5 { font-size: .92rem; color: var(--plum-900); margin-bottom: .35rem; }
.buddy-chip {
  display: inline-flex; align-items: center; gap: .35rem;
  background: linear-gradient(135deg, #fff8e8, #fff);
  border: 1px solid rgba(201, 162, 74, 0.35);
  padding: .4rem .75rem; border-radius: 999px; font-size: .82rem; font-weight: 600;
  color: #7a5a12;
}

/* Feed */
.feed-item {
  display: grid; grid-template-columns: auto 1fr; gap: .9rem;
  padding: 1.05rem 0; border-bottom: 1px solid rgba(94, 45, 150, 0.08);
}
.feed-item:last-child { border-bottom: none; }
.feed-dot {
  width: 44px; height: 44px; border-radius: 14px;
  background: linear-gradient(145deg, #f3e8fa, #e4d0f4);
  color: var(--plum-700); display: grid; place-items: center; font-size: 1.15rem;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.7);
}
.feed-body h4 { font-size: .98rem; color: var(--plum-900); }
.feed-body .time { font-size: .78rem; color: var(--muted); }

.empty-state { text-align: center; padding: 2.6rem 1rem; color: var(--muted); }
.alert {
  padding: .95rem 1.1rem; border-radius: 14px; font-size: .9rem; margin-bottom: 1rem;
  border: 1px solid transparent;
}
.alert-info { background: #eef4ff; color: #1e4db0; border-color: #c9dbff; }
.alert-warning { background: #fff8e8; color: #8a5608; border-color: #f5e0a8; }
.alert-success { background: #e9faf3; color: #0b5f44; border-color: #b6ebda; }

.chart-box { position: relative; height: 270px; width: 100%; }
.chart-box.tall { height: 320px; }
.chart-box.dept { height: 360px; }
.dash-hero {
  margin-bottom: 1.35rem;
  padding: 1.35rem 1.45rem 1.2rem;
  border-radius: var(--radius);
  background:
    linear-gradient(135deg, rgba(74, 36, 120, 0.06), rgba(201, 162, 74, 0.08)),
    rgba(255,255,255,.9);
  border: 1px solid rgba(94, 45, 150, 0.12);
  box-shadow: var(--shadow);
}
.dash-hero h3 {
  font-size: 1.28rem;
  color: var(--plum-900);
  margin-bottom: .35rem;
}
.dash-hero .dash-sub {
  color: var(--muted);
  font-size: .92rem;
  margin-bottom: 1rem;
  max-width: 62ch;
}
.dash-chips {
  display: flex; flex-wrap: wrap; gap: .5rem;
  margin-top: .85rem;
}
.dash-chip {
  display: inline-flex; align-items: center; gap: .4rem;
  padding: .35rem .75rem;
  border-radius: 999px;
  font-family: var(--font-display);
  font-size: .8rem;
  font-weight: 600;
  background: var(--plum-50);
  color: var(--plum-800);
  border: 1px solid rgba(94, 45, 150, 0.12);
}
.dash-chip em {
  font-style: normal;
  color: var(--plum-600);
  font-weight: 700;
}
.dash-chip.soft {
  background: rgba(201, 162, 74, 0.12);
  color: #7a5a10;
  border-color: rgba(201, 162, 74, 0.28);
}
.dash-section-label {
  font-family: var(--font-display);
  font-size: .82rem;
  font-weight: 600;
  letter-spacing: .04em;
  color: var(--muted);
  margin: 1.35rem 0 .75rem;
  text-transform: uppercase;
}
.progress-bar {
  height: 9px; background: var(--plum-100); border-radius: 999px; overflow: hidden;
}
.progress-bar > span {
  display: block; height: 100%;
  background: linear-gradient(90deg, var(--plum-500), var(--plum-700), var(--gold));
  border-radius: 999px; transition: width .55s var(--ease);
}

.section-intro { margin-bottom: 1.25rem; }
.section-intro p { color: var(--muted); font-size: .95rem; max-width: 60ch; }

.insight-card {
  background: linear-gradient(145deg, #3a1d5c, #5e2d96 60%, #7a3fb8);
  color: #fff; border-radius: var(--radius); padding: 1.45rem;
  position: relative; overflow: hidden; box-shadow: var(--shadow-glow);
  min-height: 160px;
}
.insight-card::after {
  content: ''; position: absolute; width: 140px; height: 140px; border-radius: 50%;
  background: rgba(255,255,255,.08); right: -36px; top: -36px;
}
.insight-card::before {
  content: ''; position: absolute; width: 80px; height: 80px; border-radius: 50%;
  border: 1px solid rgba(240, 223, 154, 0.35); left: -20px; bottom: -20px;
}
.insight-card h4 { font-size: 1.05rem; margin-bottom: .55rem; position: relative; }
.insight-card p { font-size: .9rem; opacity: .92; position: relative; }
.insight-card .action {
  margin-top: 1rem; display: inline-flex; font-family: var(--font-display);
  font-weight: 600; font-size: .85rem; color: var(--gold-soft);
}

.portal-banner {
  background:
    radial-gradient(600px 200px at 90% 20%, rgba(240, 223, 154, 0.18), transparent 50%),
    linear-gradient(125deg, #241238 0%, #4b2478 48%, #7a3fb8 100%);
  color: #fff; border-radius: 28px; padding: 1.9rem 1.85rem;
  margin-bottom: 1.6rem; position: relative; overflow: hidden;
  box-shadow: var(--shadow-lg);
}
.portal-banner::before {
  content: ''; position: absolute; width: 220px; height: 220px; border-radius: 50%;
  background: rgba(255,255,255,.07); right: -50px; bottom: -70px;
}
.portal-banner::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(120deg, transparent 40%, rgba(255,255,255,.06) 50%, transparent 60%);
  pointer-events: none;
}
.portal-banner h2 { font-size: clamp(1.4rem, 2.5vw, 1.7rem); margin-bottom: .4rem; position: relative; }
.portal-banner p { opacity: .92; max-width: 52ch; position: relative; }
.quick-links {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
  gap: .75rem; margin-top: 1.35rem; position: relative;
}
.quick-link {
  background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22);
  border-radius: 16px; padding: .95rem .7rem; color: #fff; text-align: center;
  font-family: var(--font-display); font-weight: 600; font-size: .84rem;
  transition: background .22s, transform .22s, border-color .22s;
  backdrop-filter: blur(6px);
}
.quick-link:hover {
  background: rgba(255,255,255,.22); color: #fff; transform: translateY(-3px);
  border-color: rgba(240, 223, 154, 0.5);
}
.quick-link span { display: block; font-size: 1.45rem; margin-bottom: .35rem; }

/* ===== เข็มทิศอนาคต (student pathway) ===== */
.pathway-hero {
  position: relative;
  overflow: hidden;
  border-radius: 28px;
  padding: clamp(1.6rem, 3.5vw, 2.4rem);
  margin-bottom: 1.5rem;
  color: #fff;
  background:
    radial-gradient(900px 420px at 0% 0%, rgba(240, 223, 154, 0.28), transparent 55%),
    radial-gradient(700px 380px at 100% 100%, rgba(46, 180, 140, 0.22), transparent 50%),
    linear-gradient(135deg, #1a0f2e 0%, #2d1848 42%, #1f3d3a 100%);
  box-shadow: var(--shadow-lg);
  isolation: isolate;
}
.pathway-hero::before {
  content: '';
  position: absolute;
  inset: -20% auto auto 55%;
  width: 55%;
  height: 140%;
  background:
    conic-gradient(from 210deg, transparent 0 62%, rgba(240,223,154,.12) 70%, transparent 78%),
    radial-gradient(circle at 40% 45%, rgba(255,255,255,.08), transparent 62%);
  pointer-events: none;
  animation: pathwayOrbit 18s linear infinite;
  z-index: 0;
}
.pathway-hero::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.06) 48%, transparent 62%);
  animation: pathwaySheen 7s ease-in-out infinite;
  pointer-events: none;
  z-index: 0;
}
@keyframes pathwayOrbit {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
@keyframes pathwaySheen {
  0%, 100% { opacity: .35; transform: translateX(-6%); }
  50% { opacity: .85; transform: translateX(6%); }
}
.pathway-hero-inner { position: relative; z-index: 1; max-width: 62ch; }
.pathway-kicker {
  display: inline-flex;
  align-items: center;
  gap: .45rem;
  font-family: var(--font-display);
  font-size: .78rem;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--gold-soft);
  margin-bottom: .75rem;
}
.pathway-hero h2 {
  font-size: clamp(1.65rem, 3.4vw, 2.35rem);
  font-weight: 800;
  letter-spacing: -0.03em;
  margin-bottom: .55rem;
  background: linear-gradient(92deg, #fff 10%, #f0df9a 55%, #9fe8cb 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.pathway-hero p { opacity: .9; font-size: 1.02rem; margin-bottom: 1.25rem; }
.pathway-hero-actions { display: flex; flex-wrap: wrap; gap: .65rem; }
.pathway-hero .btn-gold {
  background: linear-gradient(135deg, #e8d48a, #c9a24a);
  color: #2a1840;
  border: none;
  box-shadow: 0 10px 24px rgba(201, 162, 74, 0.35);
}
.pathway-hero .btn-gold:hover { filter: brightness(1.05); transform: translateY(-1px); }
.pathway-hero .btn-ghost-light {
  background: rgba(255,255,255,.1);
  border: 1px solid rgba(255,255,255,.28);
  color: #fff;
}
.pathway-hero .btn-ghost-light:hover { background: rgba(255,255,255,.18); color: #fff; }
.pathway-meta-row {
  display: flex; flex-wrap: wrap; gap: .55rem; margin-top: 1.2rem;
}
.pathway-chip {
  display: inline-flex; align-items: center; gap: .35rem;
  padding: .35rem .7rem; border-radius: 999px;
  background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18);
  font-family: var(--font-display); font-size: .78rem; font-weight: 600;
}
.pathway-layout {
  display: grid;
  grid-template-columns: 1.05fr .95fr;
  gap: 1.15rem;
  margin-bottom: 1.15rem;
}
@media (max-width: 960px) {
  .pathway-layout { grid-template-columns: 1fr; }
}
.pathway-panel {
  background: linear-gradient(180deg, #fff, #fbf8fe);
  border: 1px solid var(--line);
  border-radius: 24px;
  padding: 1.25rem 1.3rem 1.4rem;
  box-shadow: var(--shadow);
}
.pathway-panel h3 {
  font-size: 1.05rem;
  color: var(--plum-900);
  margin-bottom: .85rem;
  display: flex; align-items: center; justify-content: space-between; gap: .5rem;
}
.pathway-panel .sub { color: var(--muted); font-size: .88rem; margin: -.35rem 0 1rem; }
.pathway-radar-wrap {
  position: relative;
  height: min(320px, 55vw);
  max-width: 420px;
  margin: 0 auto;
}
.strength-list { display: grid; gap: .7rem; }
.strength-row {
  display: grid;
  grid-template-columns: 7.5rem 1fr auto;
  gap: .65rem;
  align-items: center;
}
.strength-row .label {
  font-family: var(--font-display); font-weight: 600; font-size: .86rem; color: var(--plum-800);
}
.strength-bar {
  height: 10px; border-radius: 999px; background: var(--plum-100); overflow: hidden;
}
.strength-bar > i {
  display: block; height: 100%; border-radius: inherit;
  background: linear-gradient(90deg, #2fb889, #c9a24a 70%, #e8d48a);
  width: 0; transition: width 1.1s var(--ease);
}
.strength-row .pct {
  font-family: var(--font-display); font-weight: 700; font-size: .84rem; color: var(--plum-700);
  min-width: 2.6rem; text-align: right;
}
.track-pills { display: flex; flex-wrap: wrap; gap: .55rem; }
.track-pill {
  padding: .55rem .9rem; border-radius: 999px;
  font-family: var(--font-display); font-weight: 600; font-size: .86rem;
  background: var(--plum-50); color: var(--plum-800); border: 1px solid var(--line);
}
.track-pill.top {
  background: linear-gradient(135deg, rgba(201,162,74,.22), rgba(47,184,137,.18));
  border-color: rgba(201,162,74,.55);
  color: #2a1840;
  box-shadow: 0 6px 16px rgba(201,162,74,.18);
}
.match-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 1rem;
  margin-bottom: 1.15rem;
}
.match-item {
  position: relative;
  border-radius: 22px;
  padding: 1.15rem 1.15rem 1.2rem;
  background:
    linear-gradient(165deg, #fff 0%, #fbf7ff 100%);
  border: 1px solid var(--line);
  overflow: hidden;
  transition: transform .25s var(--ease), box-shadow .25s var(--ease);
}
.match-item:hover {
  transform: translateY(-4px);
  box-shadow: 0 16px 36px rgba(36, 18, 56, 0.12);
}
.match-item.rank-1 {
  background:
    radial-gradient(280px 140px at 100% 0%, rgba(240,223,154,.35), transparent 60%),
    linear-gradient(165deg, #fff8e8, #fff);
  border-color: rgba(201,162,74,.45);
}
.match-rank {
  position: absolute; top: .9rem; right: .95rem;
  font-family: var(--font-display); font-weight: 800; font-size: .78rem;
  color: var(--gold); letter-spacing: .04em;
}
.match-item h4 { font-size: 1.05rem; color: var(--plum-900); margin: .15rem 0 .35rem; padding-right: 3rem; }
.match-item .fit {
  font-family: var(--font-display); font-weight: 700; color: #1f7a5a; font-size: .9rem; margin-bottom: .55rem;
}
.match-tags { display: flex; flex-wrap: wrap; gap: .35rem; margin: .55rem 0; }
.match-tags span {
  font-size: .75rem; padding: .22rem .5rem; border-radius: 8px;
  background: var(--plum-50); color: var(--plum-700); font-family: var(--font-display); font-weight: 600;
}
.match-item ul { margin: .4rem 0 0 1.05rem; color: var(--muted); font-size: .88rem; }
.pathway-timeline {
  display: grid; gap: 0; margin: .4rem 0 0;
  border-left: 2px solid rgba(201,162,74,.45);
  padding-left: 1.1rem;
}
.pathway-step {
  position: relative;
  padding: 0 0 1.15rem;
  animation: rise .45s var(--ease) both;
}
.pathway-step:nth-child(2) { animation-delay: .08s; }
.pathway-step:nth-child(3) { animation-delay: .16s; }
.pathway-step:nth-child(4) { animation-delay: .24s; }
.pathway-step::before {
  content: '';
  position: absolute;
  left: -1.35rem; top: .35rem;
  width: 12px; height: 12px; border-radius: 50%;
  background: linear-gradient(135deg, #f0df9a, #2fb889);
  box-shadow: 0 0 0 4px rgba(240,223,154,.25);
}
.pathway-step .when {
  font-family: var(--font-display); font-size: .78rem; font-weight: 700;
  color: #1f7a5a; letter-spacing: .02em; margin-bottom: .2rem;
}
.pathway-step h5 { color: var(--plum-900); margin-bottom: .25rem; }
.pathway-step p { color: var(--muted); font-size: .9rem; }
.chip-select {
  display: flex; flex-wrap: wrap; gap: .45rem;
}
.chip-select label {
  cursor: pointer;
  user-select: none;
  padding: .45rem .75rem;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: #fff;
  font-family: var(--font-display);
  font-size: .82rem;
  font-weight: 600;
  color: var(--plum-800);
  transition: .2s var(--ease);
}
.chip-select input { display: none; }
.chip-select label:has(input:checked) {
  background: linear-gradient(135deg, rgba(47,184,137,.18), rgba(201,162,74,.22));
  border-color: rgba(201,162,74,.55);
  color: #1f3d3a;
  box-shadow: 0 4px 12px rgba(201,162,74,.15);
}
.grade-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: .75rem;
}
.pathway-empty {
  text-align: center;
  padding: 2rem 1rem 1.5rem;
}
.pathway-empty .orb {
  width: 88px; height: 88px; margin: 0 auto 1rem;
  border-radius: 50%;
  background:
    radial-gradient(circle at 35% 30%, #fff8, transparent 45%),
    linear-gradient(145deg, #c9a24a, #2fb889 70%, #5e2d96);
  box-shadow: 0 12px 30px rgba(47,184,137,.28);
  animation: pathwayOrbit 12s linear infinite;
}
.insight-strip {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: .85rem;
  margin-bottom: 1.15rem;
}
@media (max-width: 800px) {
  .insight-strip { grid-template-columns: 1fr; }
}
.insight-mini {
  border-radius: 18px;
  padding: 1rem 1.05rem;
  background: linear-gradient(160deg, #fff, #f7f1fc);
  border: 1px solid var(--line);
}
.insight-mini .lbl {
  font-family: var(--font-display); font-size: .75rem; font-weight: 700;
  color: var(--muted); letter-spacing: .04em; text-transform: uppercase;
}
.insight-mini .val {
  font-family: var(--font-display); font-weight: 800; font-size: 1.15rem;
  color: var(--plum-900); margin-top: .25rem;
}
.insight-mini .hint { font-size: .84rem; color: var(--muted); margin-top: .2rem; }
.nav-list a.nav-featured.nav-pathway {
  background:
    linear-gradient(135deg, rgba(47, 184, 137, 0.35), rgba(201, 162, 74, 0.32) 50%, rgba(122, 63, 184, 0.28));
  border-color: rgba(240, 223, 154, 0.7);
}

.score-ring {
  width: 128px; height: 128px; border-radius: 50%;
  background: conic-gradient(var(--plum-500) calc(var(--score) * 1%), var(--plum-100) 0);
  display: grid; place-items: center; margin: 0 auto;
  box-shadow: 0 10px 30px rgba(94, 45, 150, 0.18);
}
.score-ring-inner {
  width: 102px; height: 102px; border-radius: 50%; background: #fff;
  display: grid; place-items: center; font-family: var(--font-display);
  font-weight: 800; font-size: 1.65rem; color: var(--plum-800);
}

.duty-map { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: .9rem; }
.duty-spot {
  border: 1.5px dashed var(--plum-300); border-radius: 16px; padding: 1.05rem;
  text-align: center; background: linear-gradient(160deg, #f8f2fc, #fff);
  transition: transform .2s, border-color .2s;
}
.duty-spot:hover { transform: translateY(-2px); }
.duty-spot.assigned {
  border-style: solid; border-color: var(--plum-500);
  background: #fff; box-shadow: var(--shadow);
}
.duty-spot h5 { color: var(--plum-800); font-size: .92rem; }
.duty-spot p { font-size: .8rem; color: var(--muted); margin-top: .3rem; }

.filter-bar { display: flex; flex-wrap: wrap; gap: .65rem; align-items: center; margin-bottom: 1rem; }
.filter-bar .form-control { width: auto; min-width: 160px; }

.video-player-wrap {
  position: relative; width: 100%; aspect-ratio: 16/9;
  background: #14081f; border-radius: 18px; overflow: hidden; margin: 1rem 0;
  box-shadow: var(--shadow-lg);
}
.video-player-wrap iframe, .video-player-wrap video { width: 100%; height: 100%; border: 0; display: block; }
.toolbar-row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin-bottom: 1rem; }
.chip-file { font-size: .8rem; color: var(--muted); }
#login-root:not(.active) { display: none !important; }
#app-stage:empty { display: none; }
.danger-link {
  color: var(--danger); font-size: .82rem; cursor: pointer;

  function ensureMathVideoSeed(d) {
    if (!Array.isArray(d.videos)) d.videos = [];
    const seeded = seedMathVideos();
    const existingIds = new Set(d.videos.map((v) => v.id));
    let changed = false;
    seeded.forEach((v) => {
      if (!existingIds.has(v.id)) {
        d.videos.push(v);
        existingIds.add(v.id);
        changed = true;
      }
    });
    if (d.mathVideoSeed !== MATH_VIDEO_SEED) {
      d.mathVideoSeed = MATH_VIDEO_SEED;
      changed = true;
    }
    return changed;
  }

    applyReports(reports) {
      Store.update((d) => {
        d.helmetReports = [];
        d.lateReports = [];
        d.misconductReports = [];
        (reports || []).forEach((r) => {
          const type = r.type || r.typeKey;
          if (type === 'helmet') {
            d.helmetReports.push({
              id: r.id,
              studentId: r.studentId,
              plate: r.plate || '',
              note: r.detail || r.note || '',
              date: r.date,
              by: r.by || '',
              status: r.status || 'pending',
              reviewedBy: r.reviewedBy || '',
              reviewedAt: r.reviewedAt || '',
            });
          } else if (type === 'late') {
            d.lateReports.push({
              id: r.id,
              studentId: r.studentId,
              recorder: r.by || r.recorder || '',
              note: r.detail || r.note || '',
              date: r.date,
              status: r.status || 'pending',
              reviewedBy: r.reviewedBy || '',
              reviewedAt: r.reviewedAt || '',
            });
          } else {
            d.misconductReports.push({
              id: r.id,
              studentId: r.studentId,
              category: r.category || 'อื่น ๆ',
              detail: r.detail || r.note || '',
              date: r.date,
              by: r.by || '',
              status: r.status || 'pending',
              reviewedBy: r.reviewedBy || '',
              reviewedAt: r.reviewedAt || '',
            });
          }
        });
      });
    },
    async pull() {
      const res = await this.list();
      if (!res.ok) throw new Error(res.error || 'ดึงข้อมูลไม่สำเร็จ');
      this.applyReports(res.reports || []);

  };

  /* ---------- IndexedDB for video / image files ---------- */
  const VideoDB = {
    open() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    },
    async put(id, blob) {
      const db = await this.open();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, 'readwrite');
        tx.objectStore(IDB_STORE).put(blob, id);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    },
    async get(id) {
      const db = await this.open();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, 'readonly');
        const req = tx.objectStore(IDB_STORE).get(id);
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => reject(req.error);
      });
    },
    async del(id) {
      const db = await this.open();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, 'readwrite');
        tx.objectStore(IDB_STORE).delete(id);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    },
  };

  const IMG_MAX_BYTES = 8 * 1024 * 1024;

  function compressImageFile(file, maxW = 1280, quality = 0.78) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        try {
          const scale = Math.min(1, maxW / img.width);
          const w = Math.max(1, Math.round(img.width * scale));
          const h = Math.max(1, Math.round(img.height * scale));
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          canvas.toBlob(
            (blob) => {
              URL.revokeObjectURL(url);
              if (!blob) reject(new Error('บีบอัดรูปไม่สำเร็จ'));
              else resolve(blob);
            },
            'image/jpeg',
            quality
          );
        } catch (err) {
          URL.revokeObjectURL(url);
          reject(err);
        }
      };
      img.onerror = () => {
        URL.revokeObjectURL(url);
        reject(new Error('อ่านไฟล์รูปไม่สำเร็จ'));
      };
      img.src = url;
    });
  }

  async function saveImageFile(file) {
    if (!file) return null;
    if (!String(file.type || '').startsWith('image/')) throw new Error('กรุณาเลือกไฟล์รูปภาพ');
    if (file.size > IMG_MAX_BYTES) throw new Error('รูปใหญ่เกิน 8MB');
    const blob = await compressImageFile(file);
    const id = uid('img');
    await VideoDB.put(id, blob);
    return id;
  }

  async function imageObjectUrl(imageId) {
    if (!imageId) return '';
    const blob = await VideoDB.get(imageId);
    if (!blob) return '';
    return URL.createObjectURL(blob);
  }

  async function hydrateImages(root) {
    if (!root) return;
    const nodes = root.querySelectorAll('[data-img-id]');
    await Promise.all(
      [...nodes].map(async (el) => {
        const id = el.dataset.imgId;
        if (!id || el.dataset.hydrated === '1') return;
        try {
          const src = await imageObjectUrl(id);
          if (!src) {
            el.innerHTML = '<div class="media-skeleton">ไม่พบรูป</div>';
            return;
          }
          el.dataset.hydrated = '1';
          el.innerHTML = `<img src="${src}" alt="แนบรูป" loading="lazy" />`;
          el.onclick = (ev) => {
            ev.stopPropagation();
            openImageLightbox(src);
          };
        } catch {
          el.innerHTML = '<div class="media-skeleton">โหลดรูปไม่สำเร็จ</div>';
        }
      })
    );
  }

  function bindImagePicker(fileInput, previewEl, clearBtn) {
    if (!fileInput || !previewEl) return;
    const show = (file) => {
      if (!file) {
        previewEl.classList.remove('is-on');
        previewEl.querySelector('img')?.remove();
        fileInput.value = '';
        return;
      }
      const url = URL.createObjectURL(file);
      let img = previewEl.querySelector('img');
      if (!img) {
        img = document.createElement('img');
        img.alt = 'ตัวอย่างรูป';
        previewEl.appendChild(img);
      }
      img.src = url;
      previewEl.classList.add('is-on');
    };
    fileInput.onchange = () => {
      const file = fileInput.files?.[0];
      if (!file) return show(null);
      if (!String(file.type || '').startsWith('image/')) {
        toast('กรุณาเลือกไฟล์รูปภาพ', 'warning');
        fileInput.value = '';
        return show(null);
      }
      if (file.size > IMG_MAX_BYTES) {
        toast('รูปใหญ่เกิน 8MB', 'warning');
        fileInput.value = '';
        return show(null);
      }
      show(file);
    };
    if (clearBtn) {
      clearBtn.onclick = (e) => {
        e.preventDefault();
        show(null);
      };
    }
  }

  function activityMode(category) {
    if (/อบรม|ค่าย/.test(String(category || ''))) return 'buddy';
    return 'team';
  }

  function normalizeActivity(a) {
    if (!a || typeof a !== 'object') return a;
    const mode = a.mode || activityMode(a.category);
    const teams = Array.isArray(a.teams)
      ? a.teams
      : [];
    const buddies = Array.isArray(a.buddies) ? a.buddies : [];
    const suggestedSize =
      Number(a.suggestedSize || a.teamSize || 0) || (mode === 'team' ? 3 : 0);
    return {
      ...a,
      mode,
      suggestedSize,
      teams,
      buddies,
      open: a.open !== false,
    };
  }

  function ensureActivitiesShape(d) {
    if (!Array.isArray(d.activities)) d.activities = [];
    d.activities = d.activities.map(normalizeActivity);

  function memberName(m) {
    if (!m) return '';

  function memberLabel(m) {
    if (!m) return '';
    if (typeof m === 'string') return m;
    return [m.name, m.className, m.contact].filter(Boolean).join(' · ');
  }

  function memberMatches(m, name) {
    return memberName(m) === name;

  function isInActivityTeam(act, name, sid) {
    return (act.teams || []).some((t) => {
      if (t.leader === name || (sid && t.leaderId === sid)) return true;
      return (t.members || []).some((m) => {
        if (typeof m === 'string') return m === name;
        return m.name === name || (sid && m.studentId === sid);
      });
    });
  }

  function findMyTeam(act, name, sid) {
    return (
      (act.teams || []).find((t) => {
        if (t.leader === name || (sid && t.leaderId === sid)) return true;
        return (t.members || []).some((m) => {
          if (typeof m === 'string') return m === name;
          return m.name === name || (sid && m.studentId === sid);
        });
      }) || null
    );

  function youtubeId(url) {
    if (!url) return null;
    const m = String(url).match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/))([\w-]{11})/);
    return m ? m[1] : null;
  }

  function youtubePlaylistId(url) {
    if (!url) return null;
    const m = String(url).match(/[?&]list=([A-Za-z0-9_-]+)/);
    return m ? m[1] : null;
  }

  async function videoPlayerHtml(video) {
    const yid = youtubeId(video.url);
    if (yid) {
      return `<div class="video-player-wrap"><iframe src="https://www.youtube.com/embed/${yid}?rel=0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen title="${esc(video.title)}"></iframe></div>`;
    }
    const plist = youtubePlaylistId(video.url);
    if (plist) {
      return `<div class="video-player-wrap"><iframe src="https://www.youtube.com/embed/videoseries?list=${encodeURIComponent(plist)}&rel=0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen title="${esc(video.title)}"></iframe></div>`;
    }
    if (video.fileId) {
      const blob = await VideoDB.get(video.fileId);
      if (blob) {
        const src = URL.createObjectURL(blob);
        return `<div class="video-player-wrap"><video controls src="${src}" playsinline></video></div>`;
      }
    }
    if (video.url && (/\.mp4($|\?)/i.test(video.url) || video.url.startsWith('blob:') || video.url.startsWith('data:video'))) {
      return `<div class="video-player-wrap"><video controls src="${esc(video.url)}" playsinline></video></div>`;
    }
    if (video.url) {
      return `<div class="alert alert-info">เปิดลิงก์วิดีโอ: <a href="${esc(video.url)}" target="_blank" rel="noopener">${esc(video.url)}</a></div>`;
    }
    return `<div class="alert alert-warning">ยังไม่มีไฟล์หรือลิงก์วิดีโอ</div>`;
  }

  function ensureBehavior(data, studentId, name) {
    let b = data.behaviorScores.find((x) => x.studentId === studentId);
    if (!b) {
      b = { studentId, name: name || 'นักเรียนรหัส ' + studentId, className: '-', score: 100, notes: '-' };
      data.behaviorScores.push(b);
    }
    return b;
  }

  function adjustScore(data, studentId, delta, note) {
    const b = ensureBehavior(data, studentId);
    b.score = Math.max(0, Math.min(100, b.score + delta));
    if (note) b.notes = note;
  }

  function analyticsFromData(data) {
    const labels = ['จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส', 'อา'];
    // build last 7 days buckets from real reports
    const days = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      days.push(d.toISOString().slice(0, 10));
    }
    const helmetWeekly = days.map((day) => data.helmetReports.filter((r) => r.date === day).length);
    const lateWeekly = days.map((day) => data.lateReports.filter((r) => r.date === day).length);
    const misconductTypeWeekly = days.map((day) => misconductList(data).filter((r) => r.date === day).length);
    const misconductWeekly = days.map((_, i) => helmetWeekly[i] + lateWeekly[i] + misconductTypeWeekly[i]);
    const dayLabels = days.map((day) => {
      const d = new Date(day + 'T12:00:00');
      return labels[d.getDay()];
    });
    const totalTasks = data.tasks.length || 1;
    const done = data.tasks.filter((t) => t.status === 'done').length;
    const completion = Math.round((done / totalTasks) * 100);
    const taskCompletion = days.map(() => completion);
    const avg = data.behaviorScores.length
      ? Math.round(data.behaviorScores.reduce((s, b) => s + b.score, 0) / data.behaviorScores.length)
      : 0;
    const behaviorAvg = days.map(() => avg);
    const helmetTotal = helmetWeekly.reduce((s, n) => s + n, 0);
    const lateTotal = lateWeekly.reduce((s, n) => s + n, 0);
    const misconductTypeTotal = misconductTypeWeekly.reduce((s, n) => s + n, 0);
    const misconductTotal = helmetTotal + lateTotal + misconductTypeTotal;
    const deptWorkload = {
      labels: DEPTS.map((d) => d.replace('ฝ่าย', '')),
      values: DEPTS.map((d) => data.tasks.filter((t) => t.dept === d).length),
    };
    return {
      labels: dayLabels,
      helmetWeekly,
      lateWeekly,
      misconductTypeWeekly,
      misconductWeekly,
      helmetTotal,
      lateTotal,
      misconductTypeTotal,
      misconductTotal,
      taskCompletion,
      behaviorAvg,
      deptWorkload,
      days,
    };
  }

  function chartFont() {
    return { family: "'Prompt', 'Sarabun', sans-serif" };
  }
  function makeAreaGradient(ctx, colorTop, colorBottom) {
    const g = ctx.createLinearGradient(0, 0, 0, 280);
    g.addColorStop(0, colorTop);
    g.addColorStop(1, colorBottom);
    return g;
  }
  function niceMax(values) {
    const m = Math.max(0, ...values);
    if (m <= 2) return 4;
    if (m <= 5) return 6;
    return Math.ceil((m + 1) / 2) * 2;
  }

  function renderCalendar(container, events, year, month) {
    const first = new Date(year, month, 1);
    const startDay = first.getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const today = todayISO();
    const heads = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'];
    let html = heads.map((h) => `<div class="cal-head">${h}</div>`).join('');
    for (let i = 0; i < startDay; i++) html += `<div class="cal-day empty"></div>`;
    for (let d = 1; d <= daysInMonth; d++) {
      const iso = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const dayEvents = events.filter((e) => e.date === iso);
      html += `<div class="cal-day ${iso === today ? 'today' : ''}"><div class="day-num">${d}</div>${dayEvents
        .map((e) => `<span class="cal-event ${e.type}" title="${esc(e.title)}">${esc(e.title)}</span>`)
        .join('')}</div>`;
    }
    container.innerHTML = `<div class="cal-grid">${html}</div>`;
  }

  function orgHtml(departments) {
    const by = {};
    (departments || [])
      .filter((d) => d.level <= 2)
      .forEach((d) => {
        if (!by[d.level]) by[d.level] = [];
        by[d.level].push(d);
      });
    return [0, 1, 2]
      .map((lv) => {
        const nodes = by[lv] || [];
        if (!nodes.length) return '';
        return `<div class="org-level">${nodes
          .map((d) => {
            const isTop = lv === 0;
            const isGroup = d.kind === 'group';
            const title = isGroup ? d.name : d.person;
            const sub = isGroup ? 'กลุ่มงาน' : d.name;
            return `<div class="org-node ${isTop ? 'top' : ''} ${isGroup ? 'group-node' : ''}"><div class="name">${esc(title)}</div><div class="role">${esc(sub)}</div></div>`;
          })
          .join('')}</div>`;
      })
      .join('');
  }

    destroyCharts();

    root.querySelector('[data-user-role]').textContent = ROLES[session.role].label;
    root.querySelector('[data-user-avatar]').textContent = (session.name || '?').charAt(0);

    const nav = root.querySelector('[data-nav]');
    nav.innerHTML = navItems
      .map((n, i) => {
        const cls = [
          i === 0 ? 'active' : '',
          n.featured ? 'nav-featured' : '',
          n.id === 'pathway' ? 'nav-pathway' : '',
        ]
          .filter(Boolean)
          .join(' ');
        const hot = n.featured ? `<span class="nav-hot" title="เมนูแนะนำ">✨</span>` : '';
        return `<li><a href="#${n.id}" data-nav-id="${n.id}" class="${cls}"><span class="nav-icon">${n.icon}</span><span class="nav-label">${n.label}</span>${hot}</a></li>`;

      .join('');

      sidebar.classList.toggle('open');
      backdrop.classList.toggle('open');

      sidebar.classList.remove('open');
      backdrop.classList.remove('open');

      e.preventDefault();
      Auth.clear();

      content: root.querySelector('[data-page-content]'),
      titleEl: root.querySelector('[data-page-title]'),

        nav.querySelectorAll('a').forEach((a) => {
          a.addEventListener('click', (e) => {
            e.preventDefault();
            fn(a.dataset.navId);
          });
        });

  function bindTabs(root) {
    root.querySelectorAll('.tab-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        const tab = btn.dataset.tab;
        root.querySelectorAll('.tab-btn').forEach((b) => b.classList.toggle('active', b === btn));
        root.querySelectorAll('.tab-panel').forEach((p) => p.classList.toggle('active', p.dataset.panel === tab));
      });
    });
  }

  function emptyPathwayProfile(studentId, name) {
    return {
      studentId,
      name: name || '',
      className: '',
      grades: { thai: '', math: '', science: '', eng: '', social: '', tech: '', art: '' },
      interests: [],
      aptitudes: [],
